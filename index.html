ic skills and relationships and understanding of your own non-negotiables that you couldn't have arrived at by skipping to the end.", "I could not have been ready for Stanford if I hadn't spent years working with brands, coaching, rebuilding a practice, learning what I was actually good at outside the studio. The L, M, N, O, P weren't the unfortunate stretch before the good part. They were the preparation.", "What are your current middle letters? What is this particular stretch of L, M, N, O, P teaching you that you couldn't have learned from A or Z?", "Letter Map. Map your current middle letters — as specifically as you can. What is each one requiring of you? What skills, what patience, what self-knowledge? Then: what will you know, or be, or understand when you come through this stretch that you didn't know before you entered it? Name it. Not abstractly — specifically.", "Reflect: If the middle letters are preparation — what are they preparing you for?"]}, {"id": "3.3", "title": "The Door on the Other Side", "objective": "By the end of this lesson, you can name the specific fear that's making the middle look impenetrable — and understand that the door is thinner than it looks from far away.", "video": {"title": "The Door on the Other Side\" 90", "paragraphs": ["OPEN ON SHIBANI", "Someone told me something about fear that I've returned to more times than I can count:", "\"Fear is like a veil. It seems like a steel wall from afar. Then, slowly, as you step closer to that door, you see: it is thin and permeable. There is almost nothing there.\"", "And then: \"Practice dying before dying. For on the other side of your fear is freedom.\"", "In the Messy Middle, fear has a particular character. It's not the sharp fear of the initial decision. It's quieter — the fear that you will spend a long time in the middle and arrive, eventually, at something that wasn't worth it. The fear that makes the door at the far end look like a steel wall.", "The temptation is to turn around. To go back to the version of your life that, if it wasn't everything you wanted, at least had the virtue of being familiar.", "But here's what stepping toward the fear reveals, every time: it is thin and permeable. The door is always a door, not a wall. The middle always ends. On the other side of every genuine transition is always a beginning.", "For a new reality to come alive, we must end something first. The middle is the ending. And the ending is how the beginning becomes possible.", "So here's your practice. Name the specific fear that is making the middle feel impenetrable right now. Write it as specifically as you can — not \"I'm afraid it won't work\" but what, specifically. Then ask: if I stepped closer to this door — would it turn out to be a wall or a veil?", "What is on the other side, if you walked through it?", "FADE OUT"]}, "type": "lesson", "_body": ["Someone told me something once about fear that I have returned to more times than I can count.", "\"Fear is like a veil. It seems like a steel wall from afar. Then, slowly, as you step closer to that door, you see: it is thin and permeable. There is almost nothing there.\"", "And then: \"Practice dying before dying. For on the other side of your fear is freedom.\"", "I think about this specifically in the context of the Messy Middle — because the middle has a particular kind of fear in it. It's not the sharp fear of the initial decision, or the fear of what might happen if you fail in an obvious, external way. It's quieter than that. It's the fear of being wrong in a slow, private way. The fear that you will spend a long time in the middle and arrive, eventually, at something that wasn't worth the length of the middle. The fear that the door doesn't exist — or that you've been going in the wrong direction, and will only find out once you've gone very far down it.", "This fear makes the middle look impenetrable. It makes the door at the far end look like a steel wall. And the temptation — the thing the fear wants you to do — is to turn around. To go back to the version of your life that, if it wasn't entirely what you wanted, at least had the virtue of being familiar.", "But here's what stepping toward the fear reveals, every single time: it is thin and permeable. Not because the change becomes easy, but because the actual walking-through is always more possible than the looking-at-from-a-distance suggested. The door is always a door, not a wall. The middle always ends. On the other side of every genuine transition is always a beginning.", "For a new reality to come alive, we must end something first. The middle is the ending. And the ending is how the beginning becomes possible.", "Through the Veil. Name the specific fear that is making the middle feel impenetrable right now. Write it as honestly and specifically as you can: not \"I'm afraid it won't work\" — but what won't work , specifically, and what that would mean, and why that outcome is the one that feels most like a steel wall. Then ask: if I stepped closer to this door — actually engaged with this specific fear, rather than keeping it at a distance — would it turn out to be a wall or a veil?", "Reflect: What is on the other side of this specific fear, if you walked through it?"]}, {"id": "check-3", "title": "What the Middle Has Made", "objective": "", "video": null, "type": "capstone", "module": 3, "_body": ["Learning objective tested: Naming the evidence of what the Messy Middle has already built — inside you, not just around you — and committing to the next step from exactly where you are.", "The capstone. Look at the full stretch of the middle you've been in.", "Then:", "1. Name one thing the middle has built inside you — a skill, a clarity, a piece of self-knowledge — that you didn't have before you entered it. Be specific. 2. Name one thing you are now willing to do in the middle that you weren't willing to do before this course — ask for help, name the fear, take the fifteen-minute act, stop managing alone. 3. Name the specific next step — the N or O in your A-to-Z — that you will take this week.", "Write all three. Then take step three.", "A Closing Note", "The middle doesn't get enough credit.", "The deciding gets the celebration — the moment you said yes to something new, the resignation letter, the first day, the announcement. The arriving gets the gratitude — the moment you look back and realize you made it, the first glimpse of what the other side looks like.", "The middle gets nothing. The middle is just the middle: long, unglamorous, full of letters no one will remember when you're telling the story later.", "But the middle is where the whole thing actually happens. It is where you find out what you're made of. It is where you learn what matters enough to keep going for. It is where the person who is capable of Z gets built, slowly, through the months and years of L, M, N, O, P.", "You are in the middle. That is not a problem. That is the evidence.", "Keep going. xx Shibani"]}]}]}, {"title": "The Landing That Doesn't Match the Old Picture", "subtitle": ["A course on arriving somewhere genuinely good — that doesn't look like the life you imagined", "A 7-lesson course built from the The Alignment Check, for the disorienting experience of building something real and still feeling like you're failing."], "promise": ["By the end of this course, you will be able to:", "• Name the Landing — the specific disorientation of arriving somewhere genuinely good that doesn't match the version of success you've been measuring yourself against since you were young — and understand it as a measurement problem, not a life problem", "• Identify your own old scoring system: the picture, built years or decades ago, that you've been holding up against your current life without realizing the picture was never updated", "• Hear the sentence at the center of this work: \"I'm measuring my life against an old story\" — and then the sentence that usually follows it, once you've looked honestly: \"I wasn't even all that happy then. I'm much happier now.\"", "• Build a new scoring system, deliberately, from today — new goals, new standards, new measures of what a good life looks like, built from who you actually are now rather than who you were supposed to become", "This is not a course about gratitude as a replacement for ambition. It's a course about finding out that the scoring system was broken — and that when you build a new one from scratch, your actual life looks completely different."], "who": ["The person who arrived. She made the career shift, or navigated the transition, or came through the middle and landed somewhere new. And the place she landed is genuinely good — she knows this. It's real, it matters, she's proud of it. And yet she keeps finding it somehow insufficient when she holds it up against the picture she has carried since she was young: the picture of the life she was supposed to have, the version of success that was built for a younger version of herself in different circumstances. The person who, on paper, has a life she should feel good about — and still keeps scoring it mediocre.", "If you have ever rated your own life as failing, using a measuring stick you built before you knew anything about yourself — this is for you."], "startEnd": ["Start: You have built something real. Something good. You know this, and you're grateful. And yet when you do an honest assessment of your life, the scores come out mediocre — because the measuring stick you're using was built for a life that no longer exists, measuring a version of you that is ten years younger and living a different life in a different city.", "End: You can see the old scoring system clearly, name it for what it is — a picture made for someone who no longer exists — and choose a new one, deliberately, from the person you actually are. Not because the old picture was wrong to aspire to, but because you have outgrown it, and you deserve a scoring system that tells the truth about the life you're actually living."], "resources": ["Every lesson in this course is built directly on Shibani's own published essays — most centrally \"Is It Time for a New Story for Your Life?\" (the Stanford GSB Wheel of Life session; \"I'm measuring my life against an old story\"; \"I wasn't even all that happy then. I'm much happier now.\"; \"I don't want what I used to have\"; \"This is the old version of me. It is time to let her go.\") and \"On Making Career Shifts\" (\"no magazine covers will come from it\"; \"I'm starting over in many ways\"; \"people still describe me as someone who 'used to work at Fox' and maybe they always will; who I am today is more than my past\"). Supporting material from \"Playing with the Power of a Smile\" (\"We don't have to wait for joy to arrive. We can invite it in with our actions.\") and \"Seeing Ourselves as More Than Our Jobs\" (the cross-off exercise; the blank paper). The Landing is the state this entire body of work was built around — and the Origin Article is, at its heart, the record of the moment Shibani named it."], "modules": [{"num": 1, "title": "See What You've Actually Built", "tagline": "Recognizing the landing as genuinely good — and the old picture as the source of the gap, not the life itself", "lessons": [{"id": "1.1", "title": "The Mediocre Score", "objective": "By the end of this lesson, you can recognize the specific experience of rating an extraordinary life as mediocre — and identify which measuring stick you've been using to arrive at that score.", "video": {"title": "The Mediocre Score\" 90", "paragraphs": ["OPEN ON SHIBANI", "Day one of my executive coaching training at Stanford GSB.", "We were asked to complete the Wheel of Life assessment — eight areas of life, each rated for satisfaction. I would coach my partner through his, and he would coach me through mine.", "He went first. Everything a seven or higher. Content, largely satisfied.", "Then, it was my turn.", "\"My scores are very different,\" I began. Fun and recreation: a four. Social life is quieter than New York. Health: a four. Late forties, weight and hormones aren't what they were. Family: difficult, still working through the divorce.", "Mediocre scoring. Area after area. I felt depressed sharing this.", "My partner asked: \"How does this make you feel?\"", "\"Depressed. Sad. Actually angry.\"", "\"Why?\"", "\"Because this is not true. My life is not mediocre. My life is extraordinary — but it isn't showing up here.\"", "And then I said the thing that changed everything for me: \"I'm noticing that my ranking system is based on an old version of myself. The Fox Business anchor, ten years younger, living in New York with her husband and three kids. I'm measuring myself against that pinnacle version. I wasn't even all that happy then. I'm much happier now.\"", "The issue was not the life. The issue was the measuring stick.", "So here's your practice. Do your own wheel of life. Before you analyze the numbers, ask: what standard am I using? Is this measuring stick built from what I actually want now — or from a picture of what success was supposed to look like?", "If you removed the old picture as the standard — would the scores be different?", "FADE OUT"]}, "type": "lesson", "_body": ["It was day one of my executive coaching training at Stanford GSB.", "We were asked to complete the Wheel of Life assessment for ourselves — the exercise we would eventually use with our own coaching clients. The wheel rates eight aspects of life: fun and recreation, health, family, finances, career, personal growth, and a few others. My partner and I would coach each other through it.", "My partner went first. He rated everything a seven or higher. He was content, doing well, largely satisfied with the shape of his life. I would go next.", "Then, it was my turn.", "\"Well,\" I began, \"I know I'm not supposed to compare, but I am. My scores are very different.\"", "I went through the wheel, area by area. My fun and recreation: a four. In New York, my social calendar had been booked out for weeks — Fashion Week, cocktail parties, the particular aliveness of a life lived in that city. Now it was quieter. Dinners once or twice a week, friends mostly scattered around the country. A four.", "Health: a four. In my late forties, my weight wasn't what it once was. Hormones all over the place.", "Family: the difficulties of being a single parent, still working through the divorce.", "On and on. Mediocre scoring of every area of my life. I felt depressed and ashamed saying it out loud.", "My coaching partner asked: \"How does this make you feel?\"", "\"Depressed. Sad. Actually angry,\" I said.", "\"Why?\"", "And then something shifted. I heard myself say:", "\"Because this is actually not true. My life is not mediocre or this bad. My life is extraordinary — but it isn't showing up here.\"", "\"Tell me more.\"", "\"I'm noticing that my ranking system is based on an old version of myself. The Fox Business anchor who was ten years younger, thinner, and living in New York City with her husband and three kids. This isn't me anymore. But I'm measuring myself against that pinnacle version of myself.\"", "And then the sentence that changed everything:", "\"I wasn't even all that happy then. I'm much happier now.\"", "The issue was not the life. The issue was the measuring stick. I was rating a genuinely extraordinary current life against a picture built for a younger person in entirely different circumstances — a picture that was, in many of its specifics, one I didn't even actually want anymore. And the gap between the life and the old picture was showing up as failure . As mediocrity. As a score of four, when the life itself deserved a nine.", "Here is your practice.", "Honest Rating. Do your own wheel of life — as honestly as you can. Rate each area of your life as it actually is right now. Then, before you analyze the numbers, ask yourself: what standard am I using to give each score? Where is the measuring stick coming from? Is it built from what you actually want in your current life — or from a picture of what success was supposed to look like?", "Reflect: If you removed the old picture as the measuring standard, and rated each area against what you actually want now — would the scores be different?"]}, {"id": "1.2", "title": "The Old Version", "objective": "By the end of this lesson, you can name your own \"old version\" — the specific picture of success that was built early and has been measuring your current life without your explicit permission — and examine whether it still represents what you actually want.", "video": {"title": "The Old Version\" 90", "paragraphs": ["OPEN ON SHIBANI", "Every one of us has an old version.", "Not a bad one — just one that was built at a particular moment in time, by a particular version of ourselves, using the information and circumstances that were available then. The picture of the life we were going to have: the career, the relationships, the city, the shape of an ordinary Wednesday.", "For me, it was specific: the Fox Business anchor, ten years younger, living in New York City with her husband and three kids. Magazine covers. A certain kind of recognition.", "That version of me existed. She was real. She worked hard for everything she built.", "And then she stopped existing — through the cross-country move, the divorce, the decision to step away from full-time television. In her place came someone else: a woman in her late forties, in the Bay Area, coaching and writing, doing work that doesn't produce magazine covers. A woman who is, by her own honest assessment, significantly happier than the old version ever was.", "But here's what I hadn't noticed until that coaching session: the old version was still sitting in my measuring system. Still setting the standards. Still answering every how am I doing? with numbers calibrated for a life that no longer existed.", "She has to be deliberately, consciously retired.", "So here's your practice. Write out your own old version — as specifically as you can. The career version, the relationship version, the city and lifestyle version. Then, for each element: does this version still exist? Is it still what you actually want?", "When did you last update this picture?", "FADE OUT"]}, "type": "lesson", "_body": ["Every one of us has an old version.", "Not a bad one, not a foolish one — just one that was built at a particular moment in time, by a particular version of ourselves, using the information and the values and the circumstances that were available then. It's the picture of the life we were going to have: the career, the relationships, the body, the city, the shape of an ordinary Wednesday. Built, usually, somewhere between adolescence and early adulthood, when the future still looked like something you could plan and the parameters of a good life felt clear.", "For me, the old version was specific and vivid: the Fox Business anchor, ten years younger, thinner, living in New York City with her husband and three kids. A national profile. A certain income bracket. A social calendar that was full in a particular kind of way. Magazine covers. A type of recognition that came with being a face on television in a major market.", "That version of me existed. She was real. She worked hard for what she built.", "And then she stopped existing — not all at once, but gradually, through the cross-country move and the divorce and the decision to step away from full-time television. And in her place came someone else: a woman in her late forties, in the Bay Area, coaching and writing and doing the kind of work that doesn't produce magazine covers. A woman who is, by her own honest assessment, significantly happier than the old version was.", "But here's the thing that I hadn't noticed until that day in the coaching session: the old version was still sitting in my measuring system. Still setting the standards. Still showing up at the start of every Wheel of Life, every self-assessment, every quiet moment of how am I doing? — and answering with numbers calibrated for the life she was living, not the life I was living.", "The old version doesn't update herself automatically. She has to be deliberately, consciously retired.", "Here is your practice.", "Old Picture Map. Write out your own old version — the specific picture of success you built early, as detailed as you can make it. What was the career version? The relationship version? The body version? The lifestyle version? The city, the social life, the kind of Wednesday? Then, for each element: does this version still exist? Did it ever? Is it still what you actually want?", "Reflect: When did you last update this picture? Or has it been sitting in your measuring system, unchanged, since the original version was built?"]}, {"id": "check-1", "title": "Recognizing the Old Picture", "objective": "", "video": null, "type": "checkin", "module": 1, "_body": ["Learning objective tested: Recognizing the Landing and the old-picture problem in someone else's self-assessment.", "Scenario. A friend says: \"I should feel good about where I am. I have a career I'm proud of, a family, a life that a lot of people would envy. But honestly? When I think about where I thought I'd be by now — the title I'd have, the salary, the kind of impact I imagined — I feel like I'm behind. Like I missed something somewhere.\"", "Question. What would you ask her to help her see the measuring stick she's using? And what's one specific thing you'd invite her to name about her current life that the old picture couldn't have predicted?", "A way to think it through: The \"where I thought I'd be\" is the old picture. The question that helps is: who built that picture, and when, and did they have access to all the information you have now? The old picture was built before the career shift that gave her things she didn't even know she wanted. Before the relationships that shaped what she actually values. Before she knew herself as well as she does now. The invitation is to look at the specific things in her current life that weren't in the old picture — and ask whether they're better, or worse, or simply different. Usually what emerges is: significantly better, and simply different from what she expected."]}]}, {"num": 2, "title": "Understand the Old Scoring System", "tagline": "Why the old picture persists — and what it's costing you to keep measuring against it", "lessons": [{"id": "2.1", "title": "The Only Way to Rate a 10", "objective": "By the end of this lesson, you can name the specific conditions under which your old scoring system allows you to rate a \"10\" in key areas of your life — and understand how those conditions make genuine satisfaction structurally impossible.", "video": {"title": "The Only Way to Rate a 10\" 90", "paragraphs": ["OPEN ON SHIBANI", "In that coaching session, I went deeper. And what I found was something I hadn't quite said out loud before:", "The only way I can rate myself a ten is by hitting it out of the park. I have to be at a peak in order to be at my happiest.", "For career: if I'm not on national television, at a certain salary, at a certain title — I'm failing. For health: if I'm not at my college weight, the score gets docked. For family: if I'm not in an intact marriage, the score gets knocked.", "When I said this out loud, I could hear how the system worked: it was designed for peak performance and peak circumstances — with no accounting for change, age, season of life, or the actual current shape of my life. A scoring system that produced mediocre results no matter how extraordinary the actual life, because the conditions required for a 10 were conditions that no longer applied.", "This is the cost of the old scoring system: it makes satisfaction structurally impossible. You can't win against a standard designed for a version of yourself that doesn't exist. Work harder, achieve more, change your life significantly — the score will still come out at four, because the measuring stick is calibrated for someone else.", "The system is broken. Not the life.", "So here's your practice. For each major area — career, health, family, relationships, finances, fun — write down the specific conditions that your internal system requires for a 10. Then ask: who set this standard, and when? Is this condition still achievable, or available, or even desired?", "How many of your 10-conditions are calibrated for a life that no longer exists?", "FADE OUT"]}, "type": "lesson", "_body": ["In that coaching session, after I'd shared my scores and heard myself say that my life was extraordinary but wasn't showing up that way, my partner kept asking me to go deeper. And what I found, when I went deeper, was something I hadn't quite said out loud before:", "The only way I can rate myself a ten is by hitting it out of the park. I have to be at a peak in order to be at my happiest.", "For career: if I'm not on national television, at a certain salary level, at a certain title — I'm failing. For health: if I'm not at my college weight, the score gets docked. For family: if I'm not in an intact marriage, the score gets knocked.", "When I said this out loud, I could hear how the system worked: it was designed for peak performance and peak circumstances, with no accounting for change, age, season of life, or the actual current shape of my life. It was a scoring system that produced a mediocre score no matter how extraordinary the actual life — because the conditions required for a 10 were conditions that no longer applied to my life, and possibly never applied to the version of me who was actually doing the living.", "When I'm not perfect, hitting home runs, living aspects of my previous or younger life — then I'm gauging my life as less successful and happy. But in many cases, that's not even what I want, or is it possible.", "This is the cost of the old scoring system: not just that the scores come out wrong, but that it makes satisfaction structurally impossible. You can't win against a standard designed for a version of yourself that doesn't exist. You can work harder, achieve more, change your life significantly — and the score will still come out at four or five, because the measuring stick was calibrated for someone else.", "The system is broken, not the life.", "Here is your practice.", "Standards Audit. For each major area of your life — career, health, family, relationships, finances, fun, personal growth — write down the specific conditions that would need to be true for you to give yourself a 10. Be completely honest: not what you think should earn a 10, but what your actual internal scoring system requires. Then look at each condition and ask: who set this standard, and when? Is this condition still achievable, or available, or even desired?", "Reflect: How many of the 10-conditions in your current scoring system are calibrated for a version of your life that no longer exists?"]}, {"id": "2.2", "title": "I Don't Want What I Used to Have", "objective": "By the end of this lesson, you can say — and begin to believe — the sentence that changes everything: \"I don't want what I used to have.\" And build the evidence for why today's life contains things the old picture couldn't have offered.", "video": {"title": "I Don't Want What I Used to Have\" 90", "paragraphs": ["OPEN ON SHIBANI", "There's a sentence I said in that Stanford session that I didn't expect to say.", "Not the diagnostic one — \"I'm measuring my life against an old story.\" That one I had some sense of. But the sentence that followed, once I'd looked honestly: \"I wasn't even all that happy then. I'm much happier now.\"", "This sentence does something the old scoring system can never account for: it introduces the honest variable. The actual lived quality of the old version, not just its surface dimensions.", "The old picture shows the Fox Business anchor, ten years younger, living in New York with her husband and three kids. What the picture doesn't show is the daily reality: the pressure, the exhaustion, the particular difficulty of trying to maintain a marriage and a national television career and a newborn and a toddler, all at the same time. The picture was built from the outside. It never included the inside.", "And the inside of the old version was, in many ways, significantly harder than the inside of the current version. The current version has a kind of autonomy and alignment and peace that the old one, for all its visible success, did not.", "\"My social life is busier than it has been in years, and it is perfect exactly where it is.\"", "\"I don't want what I used to have.\"", "Said honestly — not as consolation, but as genuine assessment — this is the beginning of the new story.", "So here's your practice. Write out three things about your current life that the old picture could not have offered. Not things present despite the old picture being gone — things present because of how your life actually unfolded.", "Would you honestly trade what you have now for the old version?", "FADE OUT"]}, "type": "lesson", "_body": ["There is a sentence I said in that Stanford coaching session that I didn't quite expect to say.", "Not the diagnostic sentence — \"I'm measuring my life against an old story.\" I had some sense of that before I said it. But the sentence that followed, once I'd looked honestly:", "\"I wasn't even all that happy then. I'm much happier now.\"", "This sentence does something that the old scoring system can never account for. It introduces the honest variable: the actual lived quality of the old version, not just its surface dimensions. The old picture shows a Fox Business anchor, ten years younger, living in New York with her husband and three kids. What the picture doesn't show is the daily reality: the pressure, the hustle, the particular kind of exhaustion that comes from trying to maintain a marriage and a national television career and a newborn and a toddler and a move from the city you'd built your life in — all at the same time.", "The picture was built from the outside. It never included the inside.", "And the inside of the old version was, in many ways, significantly harder than the inside of the current version. The current version — Bay Area single mother, coaching and writing, no magazine covers — has a kind of autonomy and alignment and peace that the old version, for all its visible success, did not.", "The old picture shows you what you gave up. It doesn't show you what you gained. And what you gained is almost always invisible to the old scoring system, because the old scoring system was designed before you knew what you were gaining.", "\"My social life is busier than it has been in years, and it is perfect exactly where it is. A more hectic career wouldn't serve my children or my wellbeing right now.\"", "\"I don't want what I used to have.\"", "This sentence—said honestly, not as a consolation but as a genuine assessment — is the beginning of the new story. It's the moment the old scoring system begins to lose its grip.", "Here is your practice.", "Evidence for Now. Write out three things about your current life — your actual, present life, not the life you imagined — that the old picture could not have offered. Not things that are present despite the old picture being gone; things that are present because of the way your life has actually unfolded. These can be small. They can be quiet. They are real.", "Reflect: If you held those three things up alongside the old picture — would you honestly trade the current life for the old one?"]}, {"id": "check-2", "title": "A Judgment Question", "objective": "", "video": null, "type": "checkin", "module": 2, "_body": ["Learning objective tested: Distinguishing between releasing the old scoring system and lowering your standards — understanding that the new story is built from honest self-knowledge, not resignation.", "Question. Someone says: \"Doesn't saying 'I don't want what I used to have' just mean I'm making peace with settling? I feel like I'm giving myself permission to stop trying.\" How would you respond?", "A way to think it through: The distinction is between settling (lowering standards because you've given up) and rewriting (raising accuracy because you've grown). Settling starts from defeat: I can't have what I actually want, so I'll pretend to want this instead. Rewriting starts from honest self-knowledge: I've changed, and I know myself more clearly now than I did when the old picture was built — so I'm going to build a scoring system that actually reflects what I know. Shibani wasn't settling when she said \"I don't want what I used to have.\" She was reporting an honest finding: that what she has now, measured against what she actually values, scores higher than the old version ever did. That's not the ceiling dropping. That's the floor becoming more accurate."]}]}, {"num": 3, "title": "Write the New Story", "tagline": "Building a scoring system from today — new goals, new standards, new measures", "lessons": [{"id": "3.1", "title": "Starting From Today", "objective": "By the end of this lesson, you can begin the actual construction of a new story — a new picture built from who you actually are now, what you actually want now, and what a good life looks like when it's measured against your current self.", "video": {"title": "Starting From Today\" 90", "paragraphs": ["OPEN ON SHIBANI", "After the coaching session, I went home and began journaling.", "Not about the old story — I'd sat with that long enough. I began journaling about the new one. What would the new story look like if I built it from today? Not from the Fox Business anchor. Not from the forty-year-old checklist. From here. From now.", "Companies need to iterate and recalibrate targets. Why aren't we doing this as humans?", "The new story is a calibration. Not a lowering of standards — an accurate recalibration of what you're measuring toward, based on updated information. Based on who you are now, what you've learned, what you've discovered you care about, what you've discovered you don't.", "And here's how I've been building it: not from the outside in — not from the title or the salary or the social metrics — but from the inside out. Starting with joy: when do I actually feel it? Starting with meaning: what is the work that feels like mine? Starting with the people: who needs to be in my life for it to feel complete?", "The new story starts from today. From this forty-something woman in the Bay Area who knows more of what she wants and has much of what she needs. From here.", "So here's your practice. Answer these questions — not what the old story would say, but what you actually know to be true now: What does a good life lived look like, from today? When do you feel genuinely happy — name five specific circumstances? Who needs to be in your life for it to feel meaningful? What does success look like from where you actually stand?", "What does the new story's first line say?", "FADE OUT"]}, "type": "lesson", "_body": ["After the coaching session, I went home and began journaling.", "Not about the old story — I'd sat with that long enough. I began journaling about the new one. What would the new story look like, if I built it from today? Not from the Fox Business anchor, not from the forty-year-old checklist, not from the version of success that was built for a younger woman in a different city. From here. From now. From the forty-something woman in the Bay Area who knows a great deal about herself and what she needs and what makes her genuinely happy.", "Companies need to iterate and recalibrate targets. Why aren't we doing this as humans?", "The new story is a calibration. Not a resignation, not a lowering of standards — an accurate recalibration of what you're measuring toward, based on updated information. Based on who you are now, what has changed, what you've learned about yourself, what you've discovered you care about and what you've discovered you don't.", "Here is how I've been thinking about the construction of the new story: not from the outside in — not from the title or the salary or the social metrics — but from the inside out. Starting with joy: when do I actually feel it? Starting with meaning: what is the work that feels like mine? Starting with the people: who needs to be in my life for it to feel complete? Starting with the body: not the college-weight standard, but the actual standards of health and energy and ease that would make me feel well in the life I'm actually living.", "The new story, I've been writing to myself, starts from today. From this forty-something aged person I am now who knows more of what she wants and has much of what she needs. From here.", "You can do this too. Not because the old story was wrong to aspire to — but because it was built for a version of you that has grown, changed, and learned things the original builder didn't know. The new story is the acknowledgment of that growth. It's the updated edition.", "New Story Draft. Answer the following questions as honestly and specifically as you can — not what the old story would answer, but what you actually know to be true now. What does a good life lived look like, from today? When do you feel genuinely happy — name five specific activities or circumstances? Who needs to be in your life for it to feel meaningful? What does success look like, from where you stand right now? What does your new story's first line say?", "Reflect: What does the new story include that the old one never would have thought to?"]}, {"id": "3.2", "title": "Inviting Joy In", "objective": "By the end of this lesson, you can identify the specific things in your current life — not your imagined life — that actually produce joy, and understand that the choice to recognize and experience them is available right now, not contingent on the old picture arriving.", "video": {"title": "Inviting Joy In\" 90", "paragraphs": ["OPEN ON SHIBANI", "Here's something I believe, and I want to offer you directly:", "We don't have to wait for joy to arrive. We can invite it in with our actions.", "The old scoring system makes joy conditional: I'll feel good about my life when I get back to a certain title, a certain weight, a certain kind of recognition. The new story makes joy available: I will look honestly at what is genuinely good in my life as it is, and choose to experience it.", "This is not about pretending the old picture didn't matter. It's about refusing to let the unfulfilled parts crowd out the genuinely good parts of the actual life.", "When I made this choice, something surprising happened. The things that had been scoring fours — the quiet social life, the different kind of career — started to look different when I looked at them directly, with honest attention rather than comparison. The social life that scored low against the old New York standard was, honestly, exactly what I needed. The career that scored low against the national-television standard was, honestly, full of work that felt like mine in a way the old version never did.", "Joy was already present. I was just measuring it against the wrong standard.", "So here's your practice. Write down five things in your current life — your actual, present life — that genuinely produce joy. Not things you're supposed to feel good about. Things that actually make you feel good. Small and ordinary is fine. Real is the requirement.", "How much of your daily attention do you give to these five things — versus to what the old picture doesn't yet have?", "FADE OUT"]}, "type": "lesson", "_body": ["Here is something I've come to believe, and that I want to offer you directly:", "We don't have to wait for joy to arrive. We can invite it in with our actions.", "I believe this practically. The choice to experience what is genuinely good in the life you actually have — to turn toward it, name it, invite it rather than waiting for the old picture to show up before you allow yourself to feel it — is an action. It's a daily, deliberate, unglamorous action. And it is available to you right now, regardless of whether your current life matches the picture.", "The old scoring system makes joy conditional: I'll feel good about my life when I get back to a certain title, a certain weight, a certain kind of recognition. The new story makes joy available: I will look honestly at what is genuinely good in my life as it is, and I will choose to experience it.", "This is not about pretending the old picture didn't matter, or pretending you don't have ambitions and desires that are still unfulfilled. It's about refusing to let the unfulfilled parts of the picture crowd out the genuinely good parts of the actual life. It's about the choice — made deliberately, again and again — to experience what you have rather than managing what you don't.", "When I made this choice, something surprising happened. The things that had been showing up as fours on the Wheel of Life — the quiet social life, the different kind of career — started to look different when I looked at them directly, with honest attention rather than comparison. The social life that scored a four against the old New York standard was, looked at honestly, exactly what I needed. The career that scored low against the national-television standard was, looked at honestly, full of work that felt like mine in a way the old version never did.", "Joy was already present. I had just been measuring it against the wrong standard.", "Joy Inventory. Write down five things in your current life — not your imagined or future life, your actual current life — that genuinely produce joy. Not things you're supposed to feel good about. Things that actually make you feel good. They can be small and ordinary. They should be real.", "Reflect: How much of the time in your daily life do you actually experience these five things? And how much of the time are you focused on what isn't in the old picture yet?"]}, {"id": "3.3", "title": "The New Scoring System", "objective": "By the end of this lesson, you can build a new scoring system — from scratch, from today — a set of standards that tells the truth about the life you're actually living and the person you've actually become.", "video": {"title": "The New Scoring System\" 90", "paragraphs": ["OPEN ON SHIBANI", "This is where the work becomes practical: actually building the new scoring system.", "When I started this work after the coaching session, I had one guiding principle: start from joy, not from the checklist. The old scoring system started from the checklist — the title, the weight, the social calendar — and tried to find joy within it. The new one starts from joy and builds the checklist around it. When do I feel good? What does a good week look like? What kind of work makes me feel like myself?", "From there, I wrote new standards. Specific ones. For career: I feel successful when my work is mission-aligned, uses my specific skills, and lets me keep building alongside it. Not: I feel successful when I'm on national television. For health: I feel well when I have energy and can keep up with my kids. Not: I feel well when I'm at my college weight.", "And here is what happened when I applied the new scoring system: the scores went up. Not because the life changed — the life was exactly the same. But because the measuring stick finally matched the life.", "That is the gift. Not settling. Not lowering the bar. Raising the accuracy. Building a mirror that shows you your actual life, clearly, in the right light.", "So here's your practice. Write your new scoring system for each major area: career, health, family, relationships, fun, personal growth. For each one: what does success look like from today, built from your current values and honest self-knowledge? Apply it to your current life.", "What are the actual scores?", "FADE OUT"]}, "type": "lesson", "_body": ["This is where the work becomes practical.", "Not just naming the old picture, not just understanding why it persists, not just allowing yourself to want what you don't want anymore — but actually building the new one. Writing out, deliberately and specifically, the standards against which you'll measure your life going forward. Standards built from who you are now, what you know now, what you actually want now.", "When I began doing this work after the coaching session, I had a guiding principle: start from joy, not from the checklist. The old scoring system started from the checklist — the title, the weight, the marital status, the social calendar — and then tried to find joy within it. The new scoring system starts from joy and builds the checklist around it. When do I feel good? What does a good week look like? What kind of work makes me feel like myself? What does success feel like in my body, not just in my head?", "From there, I built new standards. Not abstract ones — specific ones. For career: I feel successful when I'm doing work that is mission-aligned, that uses my specific skills, that allows me to keep building my other work alongside it. Not: I feel successful when I'm on national television. For health: I feel well when I have energy, move my body a few times a week, and can keep up with my kids. Not: I feel well when I'm at my college weight.", "The new standards are calibrated for the life I'm actually living and the person I've actually become. They tell the truth when I look in the mirror, rather than showing me only what's missing.", "And here is what happened when I applied the new scoring system to my life: the scores went up. Not because I had achieved more externally — the life was exactly the same. But because the measuring stick finally matched the life.", "That is the gift of the new scoring system. Not settling. Not lowering the bar. Raising the accuracy. Building a mirror that shows you your actual life, clearly, in the right light.", "New Standards. Write out your new scoring system for each major area of your life: career, health, family, relationships, finances, fun, personal growth. For each one: what does success look like, from today, using your current values, current knowledge, current circumstances? What are the conditions under which you would rate yourself a 10, built from honest self-knowledge rather than old-picture standards?", "Reflect: When you apply the new standards to your current life — what are the actual scores?"]}, {"id": "check-3", "title": "The New Wheel", "objective": "", "video": null, "type": "capstone", "module": 3, "_body": ["Learning objective tested: Applying the full arc of the course — naming the old picture, releasing the old scoring system, and building a new one — to produce an honest, accurate assessment of the current life.", "The capstone. Go back to the Wheel of Life. Complete it again — this time using the new scoring system you built in Lesson 3.3. Use the standards you wrote: the ones built from who you actually are now, what you actually want now, what a good life looks like from today.", "Then:", "1. Compare the two sets of scores — the ones from the old scoring system and the ones from the new one. What changed? 2. Name one area where the change in score surprised you — where the new scoring system revealed something about your current life that the old one had been hiding 3. Name the first line of your new story — the sentence that describes who you are, starting from today", "Write all three. Then write the first line.", "A Closing Note", "You have built something real.", "I know the old picture has been sitting in your measuring system, running its comparisons, producing its mediocre scores. I know the gap between the life you have and the life you imagined has felt, sometimes, like evidence of something you got wrong.", "It isn't.", "The gap was never about /* detect practice/reflect paragraphs in lesson body */
const isReflectP = p => /^Reflect:/.test(p);
function practiceNameG(p){
    // a practice paragraph opens with a short Title-Case name then a period: "Hum Inventory. For the next..."
    const m = p.match(/^([^.!?]{3,42})\.\s+(\S[\s\S]+)/);
    if(!m) return null;
    const name=m[1].trim();
    const words=name.split(/\s+/);
    if(words.length<2||words.length>6) return null;
    const caps=words.filter(w=>/^[A-Z“"]/.test(w)).length;
    const small=words.filter(w=>/^(the|of|to|a|an|in|for|with|or|and|vs\.?|—|-|\/)$/i.test(w)).length;
    if(caps<2 || caps+small<words.length) return null;
    // exclude ordinary sentences that happen to be short
    if(/^(And|But|So|It|I|My|We|You|Here|That|This|There|Not|If|When|What|Now|Let|Then|She|He|They|No|Yes|Maybe|Because)\s/.test(name)) return null;
    return {name, rest:m[2]};
}
function renderBodyParas(paras){
  let html='', first=true;
  const isReflect = isReflectP;
  const practiceName = practiceNameG;
  let i=0;
  while(i<paras.length){
    const p=paras[i];
    if(isReflect(p)){
      html+=`<div class="callout reflect"><div class="c-label">${ic('compass')} Reflect</div><p>${esc(p.replace(/^Reflect:\s*/,''))}</p></div>`;
      i++; continue;
    }
    const pr=practiceName(p);
    if(pr && !first){
      // gather following paragraphs that belong to the practice (until Reflect or end)
      let inner=`<p><b class="pname">${esc(pr.name)}.</b> ${esc(pr.rest)}</p>`;
      let j=i+1;
      while(j<paras.length && !isReflect(paras[j]) && !practiceName(paras[j])){
        inner+=`<p>${esc(paras[j])}</p>`; j++;
      }
      html+=`<div class="callout practice"><div class="c-label">${ic('pen')} This week’s practice</div>${inner}</div>`;
      i=j; continue;
    }
    html+=`<p${first?' class="opener"':''}>${esc(p)}</p>`;
    first=false; i++;
  }
  return html;
}
function renderScriptParas(paras){
  return paras.map(p=>{
    // stage directions in [BRACKETS]
    const parts = p.split(/(\[[^\]]+\])/g).filter(Boolean);
    const body = parts.map(seg=> seg.startsWith('[') ? `<span class="stage">${esc(seg.slice(1,-1))}</span> ` : esc(seg)).join('');
    return `<p>${body}</p>`;
  }).join('');
}

let qState=null;
function viewQuiz(){
  setNav('quiz');
  qState={i:0,score:[0,0,0,0,0,0,0,0],picks:[]};
  renderQuizStep();
}
function renderQuizStep(){
  const {i}=qState;
  if(i>=QUIZ.length) return renderQuizResult();
  const Q=QUIZ[i];
  app.innerHTML=`
  <div class="quiz-wrap fade-in">
    <div class="quiz-card">
      <div class="q-step">The Alignment Check · Question ${i+1} of ${QUIZ.length}</div>
      <div class="q-dots">${QUIZ.map((_,k)=>`<i class="${k<i?'on':k===i?'cur':''}"></i>`).join('')}</div>
      <h3 class="q-title">${Q.q}</h3>
      ${Q.opts.map((o,k)=>`<button class="q-opt" data-k="${k}"><span class="tick">${ic('check')}</span><span>${o[0]}</span></button>`).join('')}
      ${i>0?`<button class="q-back" id="qBack">${ic('arrowL')} Previous question</button>`:''}
    </div>
  </div>`;
  app.querySelectorAll('.q-opt').forEach(b=>b.addEventListener('click',()=>{
    b.classList.add('picked');
    const k=+b.dataset.k;
    qState.picks[i]=k;
    setTimeout(()=>{
      QUIZ[i].opts[k][1].forEach((s,ix)=>qState.score[s]+= (ix===0?2:1));
      qState.i++;
      renderQuizStep();
    },260);
  }));
  const back=document.getElementById('qBack');
  if(back) back.addEventListener('click',()=>{
    qState.i--;
    const prev=qState.picks[qState.i];
    if(prev!=null) QUIZ[qState.i].opts[prev][1].forEach((s,ix)=>qState.score[s]-=(ix===0?2:1));
    renderQuizStep();
  });

/* ----- WYSIWYG edit mode (structure stays steady; text becomes editable) ----- */
function renderEditable(ps,kind){
  let pi=0;
  const ed=(txt,pre,cls)=>`<p data-pi="${pi++}"${pre?` data-pre="${escA(pre)}"`:''}${cls?` class="${cls}"`:''}>${esc(txt)}</p>`;
  if(kind==='script'){
    return ps.map(p=>{
      const html=p.split(/(\[[^\]]+\])/g).filter(Boolean).map(seg=> seg.startsWith('[')?`<span class="stage" contenteditable="false">${esc(seg)}</span> `:esc(seg)).join('');
      return `<p data-pi="${pi++}">${html}</p>`;
    }).join('');
  }
  if(kind==='mixed'){
    let h='',buf=[];
    const flush=()=>{ if(buf.length){ h+=`<ul>${buf.join('')}</ul>`; buf=[]; } };
    ps.forEach(p=>{
      const m=p.match(/^[•\-*]\s+([\s\S]*)$/);
      if(m) buf.push(`<li>${ic('checkC')}<span data-pi="${pi++}" data-pre="• ">${esc(m[1])}</span></li>`);
      else { flush(); h+=ed(p,null,null); }
    });
    flush(); return h;
  }
  if(kind==='startend'){
    return ps.map(p=>{
      const m=p.match(/^(Start|End):\s*([\s\S]*)$/);
      if(m) return `<div class="se">${ic(m[1]==='Start'?'compass':'flag')}<span><b contenteditable="false">${m[1]}.</b> <span data-pi="${pi++}" data-pre="${m[1]}: ">${esc(m[2])}</span></span></div>`;
      return ed(p,null,null);
    }).join('');
  }
  if(kind==='body'){
    let html='',first=true,i=0;
    while(i<ps.length){
      const p=ps[i];
      if(isReflectP(p)){
        html+=`<div class="callout reflect"><div class="c-label" contenteditable="false">${ic('compass')} Reflect</div><p data-pi="${pi++}" data-pre="Reflect: ">${esc(p.replace(/^Reflect:\s*/,''))}</p></div>`;
        i++; continue;
      }
      const pr=practiceNameG(p);
      if(pr && !first){
        let inner=`<p data-pi="${pi++}"><b>${esc(pr.name)}.</b> ${esc(pr.rest)}</p>`;
        let j=i+1;
        while(j<ps.length && !isReflectP(ps[j]) && !practiceNameG(ps[j])){ inner+=`<p data-pi="${pi++}">${esc(ps[j])}</p>`; j++; }
        html+=`<div class="callout practice"><div class="c-label" contenteditable="false">${ic('pen')} This week’s practice</div>${inner}</div>`;
        i=j; continue;
      }
      html+=ed(p,null,first?'opener':null);
      first=false; i++;
    }
    return `<div class="lesson-body">${html}</div>`;
  }
  return ps.map(p=>ed(p,null,null)).join('');
}

  document.body.classList.toggle('rv-editmode',editMode);
  const pen=document.getElementById('rvPen');
  if(pen) pen.classList.toggle('on',editMode);
  document.querySelectorAll('.rv-region').forEach(el=>{
    const key=el.getAttribute('data-rvkey');

      });

function commitEdits(){
  let changed=0;
  document.querySelectorAll('.rv-region').forEach(el=>{
    const key=el.getAttribute('data-rvkey');
    if(!ORIG[key]) return;
    const nodes=el.querySelectorAll('[data-pi][contenteditable="true"]');
    if(!nodes.length) return;
    const paras=[];
    nodes.forEach(nd=>{
      const parts=nd.innerText.split(/\n+/).map(x=>x.trim()).filter(Boolean);
      const pre=nd.getAttribute('data-pre')||'';
      parts.forEach((t,ix)=>paras.push(ix===0 && pre && !t.startsWith(pre.trim()) ? pre+t : t));
    });
    const md=paras.join('\n\n');
    const nz=x=>x.replace(/\s+/g,' ').trim();
    const before=S.edits[key]?S.edits[key].md:ORIG[key].md;
    if(nz(md)===nz(before)) return;
    if(nz(md)===nz(ORIG[key].md)){ delete S.edits[key]; changed++; return; }
    S.edits[key]={md,label:ORIG[key].label,orig:ORIG[key].md,ts:Date.now()};
    changed++;
  });
  if(changed) save();
  return changed;
}

/* ----- word-level diff (LCS) ----- */
function wordDiff(a,b,html){
  const A=a.split(/\s+/).filter(Boolean), B=b.split(/\s+/).filter(Boolean);
  const n=A.length,m=B.length;
  if(n*m>3000000) return null;
  const dp=new Array(n+1);
  for(let i=0;i<=n;i++) dp[i]=new Uint16Array(m+1);
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0; const out=[];
  const del=w=>html?`<del>${esc(w)}</del>`:`[-${w}-]`;
  const add=w=>html?`<ins>${esc(w)}</ins>`:`{+${w}+}`;
  const same=w=>html?esc(w):w;
  while(i<n&&j<m){
    if(A[i]===B[j]){ out.push(same(A[i])); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ out.push(del(A[i])); i++; }
    else { out.push(add(B[j])); j++; }
  }
  while(i<n){ out.push(del(A[i])); i++; }
  while(j<m){ out.push(add(B[j])); j++; }
  let txt=out.join(' ');
  if(html) txt=txt.replace(/<\/del> <del>/g,' ').replace(/<\/ins> <ins>/g,' ');
  else txt=txt.replace(/-\] \[-/g,' ').replace(/\+\} \{\+/g,' ');
  return txt;
}

    <button class="fab" id="rvFab" title="Write feedback">${ic('msg')}<span class="cnt" id="rvCnt" style="display:none"></span></button>
  </div>
  <div class="rv-panel" id="rvPanel">
    <div class="rv-top">
      <b id="rvTitle">Start Reviewing</b>
      <button class="iconbtn" id="rvHelp" title="How reviewing works">${ic('help')}</button>
      <div class="rv-menuwrap">
        <button class="iconbtn" id="rvMenuBtn" title="More">${ic('dots')}</button>
        <div class="rv-menu" id="rvMenu">
          <button id="rvmEdit">${ic('pen')} Edit page text</button>
          <button id="rvmSide">${ic('layers')} See all reviews</button>
          <button id="rvmDl">${ic('download')} Download review (.txt)</button>
          <button id="rvmDone">${ic('checkC')} I’ve finished my review</button>
        </div>
      </div>
    </div>
    <div class="rv-main" id="rvMain"></div>
  </div>
  <div class="rv-scrim" id="rvScrim"></div>
  <aside class="rv-side" id="rvSide" aria-label="All reviews">
    <div class="rv-side-h"><b>All Reviews</b><button class="iconbtn" id="rvSideX">${ic('x')}</button></div>
    <div class="rv-side-b" id="rvSideB"></div>
    <div class="rv-side-f">
      <button class="rv-cta" id="rvSideDl">${ic('download')} Download everything (.txt)</button>
      <div class="rv-remind">When you finish, email the downloaded file to <b>${RV_EMAIL}</b>. It lives only in this browser until you send it.</div>
    </div>
  </aside>
  <div class="rv-overlay" id="rvOverlay"></div>`;
  document.getElementById('rvFab').addEventListener('click',()=>{
    const p=document.getElementById('rvPanel');
    const opening=!p.classList.contains('open');
    p.classList.toggle('open');
    if(opening){ rvView='compose'; renderRvMain(); }
  });
  document.getElementById('rvPen').addEventListener('click',toggleEditMode);
  document.getElementById('rvHelp').addEventListener('click',showHelpModal);
  document.getElementById('rvMenuBtn').addEventListener('click',e=>{
    e.stopPropagation();
    document.getElementById('rvMenu').classList.toggle('open');
  });
  document.addEventListener('click',e=>{
    const mn=document.getElementById('rvMenu');
    if(mn&&mn.classList.contains('open')&&!e.target.closest('.rv-menuwrap')) mn.classList.remove('open');
  });
  const menuDo=fn=>()=>{ document.getElementById('rvMenu').classList.remove('open'); fn(); };
  document.getElementById('rvmEdit').addEventListener('click',menuDo(toggleEditMode));
  document.getElementById('rvmSide').addEventListener('click',menuDo(openSidebar));
  document.getElementById('rvmDl').addEventListener('click',menuDo(exportReview));
  document.getElementById('rvmDone').addEventListener('click',menuDo(showDoneModal));
  document.getElementById('rvScrim').addEventListener('click',closeSidebar);
  document.getElementById('rvSideX').addEventListener('click',closeSidebar);
  document.getElementById('rvSideDl').addEventListener('click',exportReview);
}
function renderRvMain(){
  const main=document.getElementById('rvMain');
  if(!main) return;
  const title=document.getElementById('rvTitle');
  if(rvView==='saved'){
    if(title) title.textContent='Saved';
    main.innerHTML=`
      <div class="rv-savedview">
        <h3>Your review has been saved!</h3>
        <button class="rv-cta" id="rvSeeSide">See All Reviews in Sidebar</button>
        <button class="rv-cta soft" id="rvDlNow">Download the Review</button>
        <button class="rv-back" id="rvAgain">${ic('pen')} Write another note</button>
      </div>`;
    main.querySelector('#rvSeeSide').addEventListener('click',()=>{ document.getElementById('rvPanel').classList.remove('open'); openSidebar(); });
    main.querySelector('#rvDlNow').addEventListener('click',exportReview);
    main.querySelector('#rvAgain').addEventListener('click',()=>{ rvView='compose'; renderRvMain(); });
    return;
  }
  if(title) title.textContent='Start Reviewing';
  const earlier=(S.fb[location.hash||'#/']||[]).length;
  main.innerHTML=`
    <textarea class="rv-big" id="rvNew" placeholder="Jot all your feedbacks here, your notes and more."></textarea>
    ${earlier?`<div class="rv-earlier">${earlier} earlier note${earlier===1?'':'s'} on this page — see the sidebar</div>`:''}
    <button class="rv-cta" id="rvDonePage">Done Reviewing This Page</button>`;
  main.querySelector('#rvDonePage').addEventListener('click',()=>{
    const ta=main.querySelector('#rvNew'), v=ta.value.trim();
    if(!v){ toast('Write a thought first — even one line helps','pen'); ta.focus(); return; }
    const key=location.hash||'#/';
    (S.fb[key]=S.fb[key]||[]).push({t:v,ts:Date.now(),label:pageLabel()});
    save(); updateRvCnt();
    rvView='saved'; renderRvMain();
  });
}

/* ----- sidebar ----- */
function openSidebar(){ renderSidebar(); document.getElementById('rvSide').classList.add('open'); document.getElementById('rvScrim').classList.add('open'); }
function closeSidebar(){ document.getElementById('rvSide').classList.remove('open'); document.getElementById('rvScrim').classList.remove('open'); }
function renderSidebar(){
  const b=document.getElementById('rvSideB');
  if(!b) return;
  let h='<h5>Notes</h5>';
  const ks=Object.keys(S.fb);
  if(!ks.length) h+='<div class="rv-empty">No notes yet. Open the chat bubble on any page and write your first one.</div>';
  ks.forEach(k=>{
    h+=`<div class="rv-group">${esc((S.fb[k][0]&&S.fb[k][0].label)||k)}</div>`;
    S.fb[k].forEach((n,i)=>{
      h+=`<div class="rv-note">${esc(n.t)}<small>${new Date(n.ts).toLocaleString()}</small><button class="del" data-delk="${escA(k)}" data-deli="${i}" title="Delete note">${ic('trash')}</button></div>`;
    });
  });
  h+='<h5>Edited sections</h5>';
  const eks=Object.keys(S.edits);
  if(!eks.length) h+='<div class="rv-empty">No edits yet. Tap the small pencil button, then click into any text on the page and type.</div>';
  eks.forEach(k=>{
    const e=S.edits[k];
    h+=`<div class="rv-edititem"><b>${esc(e.label||k)}</b><small>${new Date(e.ts).toLocaleString()}</small>
      <div class="row"><button data-viewdiff="${escA(k)}">View changes</button><button data-restore="${escA(k)}">Restore original</button></div>
      <div class="rv-diff" id="diff-${cssId(k)}"></div></div>`;
  });
  b.innerHTML=h;
  b.querySelectorAll('[data-delk]').forEach(x=>x.addEventListener('click',()=>{
    const k=x.getAttribute('data-delk');
    S.fb[k].splice(+x.dataset.deli,1); if(!S.fb[k].length) delete S.fb[k];
    save(); renderSidebar(); updateRvCnt();
  }));
  b.querySelectorAll('[data-viewdiff]').forEach(x=>x.addEventListener('click',()=>{
    const k=x.getAttribute('data-viewdiff');
    const box=document.getElementById('diff-'+cssId(k));
    if(!box.innerHTML){
      const e=S.edits[k];
      box.innerHTML=wordDiff(e.orig||'',e.md,true)||'(Too long for an inline diff — both versions are in the download.)';
    }
    box.classList.toggle('open');
  }));
  b.querySelectorAll('[data-restore]').forEach(x=>x.addEventListener('click',()=>{
    delete S.edits[x.getAttribute('data-restore')];
    save(); renderSidebar(); updateRvCnt(); route();
    toast('Back to the original');
  }));
}

/* ----- export & modals ----- */
function exportReview(){
  const c=rvCounts(), d=new Date(), O=[];
  O.push('# The Alignment Check — Review by Shibani Joshi','');
  O.push('Compiled: '+d.toLocaleString());
  O.push(`Summary: ${c.notes} page note(s) across ${c.pages} page(s) · ${c.edits} edited section(s)`);
  O.push('Send this file to: '+RV_EMAIL,'');
  O.push('====================================================');
  O.push('## PAGE NOTES');
  O.push('====================================================');
  const ks=Object.keys(S.fb);
  if(!ks.length) O.push('','(No page notes.)');
  ks.forEach(k=>{
    O.push('','### '+((S.fb[k][0]&&S.fb[k][0].label)||k),'');
    S.fb[k].forEach(n=>O.push(`- [${new Date(n.ts).toLocaleString()}] ${n.t}`));
  });
  O.push('','====================================================');
  O.push('## EDITS — Shibani’s rewrites (Markdown)');
  O.push('====================================================');
  const eks=Object.keys(S.edits);
  if(!eks.length) O.push('','(No edited sections.)');
  eks.forEach((k,i)=>{
    const e=S.edits[k];
    O.push('','──────────────────────────────────────────────');
    O.push(`✎ EDIT ${i+1} of ${eks.length} · ${e.label||k}`);
    O.push('Edited: '+new Date(e.ts).toLocaleString());
    O.push('──────────────────────────────────────────────');
    O.push('','#### WHAT CHANGED — inline diff ( [-removed-] {+added+} )','');
    O.push(wordDiff(e.orig||'',e.md,false)||'(Section too long for an inline diff — compare the versions below.)');
    O.push('','#### ORIGINAL','',e.orig||'(original not captured)','','#### SHIBANI’S VERSION','',e.md);
  });
  O.push('','— End of review — xx Shibani');
  const blob=new Blob([O.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`alignment-check-review-${d.toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Downloaded — now email it to '+RV_EMAIL,'mail');
}
function showHelpModal(){
  const ov=document.getElementById('rvOverlay');
  ov.innerHTML=`<div class="rv-modal">
    <button class="rv-close" id="rvClose">${ic('x')}</button>
    <h3>How reviewing works</h3>
    <div class="rv-step"><span class="n">1</span><span><b>Notes.</b> Tap the chat bubble on any page, write your thoughts, hit “Done Reviewing This Page”. Each note remembers which page it belongs to.</span></div>
    <div class="rv-step"><span class="n">2</span><span><b>Edit the text itself.</b> Tap the pencil button — the page becomes editable. Click into any paragraph and rewrite it. Tap the pencil again to save; every change is tracked.</span></div>
    <div class="rv-step"><span class="n">3</span><span><b>Everything in one place.</b> The sidebar collects all your notes and edits, with a download button at the bottom.</span></div>
    <div class="rv-step"><span class="n">4</span><span><b>When you’re done</b>, download the file and email it to <b>${RV_EMAIL}</b>.</span></div>
  </div>`;
  ov.classList.add('open');
  ov.querySelector('#rvClose').addEventListener('click',()=>ov.classList.remove('open'));
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.classList.remove('open'); });
}
function showDoneModal(){
  S.reviewDone=true; save();
  const ov=document.getElementById('rvOverlay');
  const c=rvCounts();
  ov.innerHTML=`<div class="rv-modal">
    <button class="rv-close" id="rvClose">${ic('x')}</button>
    <h3>Thank you, Shibani.</h3>
    <p>You left ${c.notes} note${c.notes===1?'':'s'} and ${c.edits} edit${c.edits===1?'':'s'}. They live only in this browser until you send them — two small steps so nothing gets lost:</p>
    <div class="rv-step"><span class="n">1</span><span><b>Download your review file.</b><br><button class="btn btn-wine btn-sm" id="rvExport2" style="margin-top:8px">${ic('download')} Download review file (.txt)</button></span></div>
    <div class="rv-step"><span class="n">2</span><span><b>Email it to ${RV_EMAIL}.</b> Attach the file you just downloaded — mail apps can’t attach it automatically.<br><a class="btn btn-yellow btn-sm" style="margin-top:8px" href="mailto:${RV_EMAIL}?subject=${encodeURIComponent('The Alignment Check — my review')}&body=${encodeURIComponent('Hi Kyle,\n\nMy review file is attached.\n\nxx Shibani')}">${ic('mail')} Open a pre-addressed email</a></span></div>
    <p style="margin:6px 0 0">That’s it. The new story starts from today. xx</p>
  </div>`;
  ov.classList.add('open');
  ov.querySelector('#rvClose').addEventListener('click',()=>ov.classList.remove('open'));
  ov.querySelector('#rvExport2').addEventListener('click',exportReview);
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.classList.remove('open'); });
}

/* ============ router ============ */
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  updatePill();
  routeView(parts);
  applyEditMode();
  const p=document.getElementById('rvPanel');
  if(p&&p.classList.contains('open')&&rvView==='compose') renderRvMain();
  if(document.getElementById('rvSide')&&document.getElementById('rvSide').classList.contains('open')) renderSidebar();
  updateRvCnt();
}
function routeView(parts){
  if(!parts.length) return viewHome();
  if(parts[0]==='states') return viewStates();
  if(parts[0]==='quiz') return viewQuiz();
  if(parts[0]==='course'&&parts[1]&&parts[2]) return viewLesson(parts[1],decodeURIComponent(parts[2]));
  if(parts[0]==='course'&&parts[1]) return viewCourse(parts[1]);
  viewHome();
}
window.addEventListener('hashchange',()=>{ if(editMode) commitEdits(); route(); window.scrollTo({top:0}); });
buildReviewUI();
route();
const _c0=rvCounts();
if((_c0.notes||_c0.edits)&&!S.reviewDone) setTimeout(()=>toast('When you finish: download your review & email it to '+RV_EMAIL,'mail'),1600);
</script>

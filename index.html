<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Alignment Check · Shibani Joshi</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#811d47;
  --wine-deep:#5c1232;
  --wine-soft:#f3e4ec;
  --wine-mid:#a8487023;
  --yellow:#fbb922;
  --yellow-soft:#fef3d8;
  --cream:#fffdf4;
  --ink:#2a2a2a;
  --ink-soft:#5b5650;
  --line:#ece5d8;
  --white:#ffffff;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(42,42,42,.04),0 8px 24px rgba(129,29,71,.07);
  --shadow-lg:0 2px 4px rgba(42,42,42,.05),0 16px 40px rgba(129,29,71,.13);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.7;font-size:16.5px;-webkit-font-smoothing:antialiased}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em;flex:none}
a{color:var(--wine)}
button{font-family:var(--sans);cursor:pointer}
::selection{background:var(--yellow);color:var(--ink)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(255,253,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px}
.wordmark{font-family:var(--serif);font-weight:800;font-size:19px;color:var(--ink);text-decoration:none;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);display:inline-block}
.byline{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-left:2px}
.hnav{margin-left:auto;display:flex;align-items:center;gap:6px}
.hnav a{font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:999px;transition:.18s}
.hnav a:hover{background:var(--wine-soft);color:var(--wine)}
.hnav a.active{background:var(--wine);color:var(--cream)}
.prog-pill{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--wine);background:var(--wine-soft);padding:7px 14px;border-radius:999px;white-space:nowrap}
@media(max-width:680px){.byline{display:none}.prog-pill span.lbl{display:none}.hwrap{padding:12px 16px}}

main{max-width:1080px;margin:0 auto;padding:0 24px 90px}
@media(max-width:680px){main{padding:0 16px 70px}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:9px;border:none;border-radius:999px;padding:14px 26px;font-size:15.5px;font-weight:600;text-decoration:none;transition:.18s;line-height:1.2}
.btn-wine{background:var(--wine);color:var(--cream)}
.btn-wine:hover{background:var(--wine-deep);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-yellow{background:var(--yellow);color:var(--ink)}
.btn-yellow:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-ghost{background:transparent;color:var(--wine);border:1.5px solid var(--wine)}
.btn-ghost:hover{background:var(--wine-soft)}
.btn-sm{padding:9px 18px;font-size:14px}

/* ---------- hero ---------- */
.hero{position:relative;padding:84px 0 64px;overflow:hidden}
.hero .lotus{position:absolute;right:-60px;top:-40px;width:420px;opacity:.55;pointer-events:none}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--wine);display:flex;align-items:center;gap:10px;margin-bottom:22px}
.kicker::before{content:"";width:34px;height:2px;background:var(--yellow);display:inline-block}
h1.display{font-family:var(--serif);font-weight:800;font-size:clamp(40px,6.4vw,72px);line-height:1.06;letter-spacing:-.01em;max-width:13em}
h1.display em{font-style:italic;color:var(--wine)}
.hero p.lede{font-size:19px;color:var(--ink-soft);max-width:34em;margin:26px 0 34px}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap}
.resume-card{margin-top:46px;display:inline-flex;align-items:center;gap:16px;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:14px;padding:14px 20px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:.18s;max-width:100%}
.resume-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.resume-card .rc-ic{width:38px;height:38px;border-radius:50%;background:var(--yellow-soft);color:var(--wine);display:flex;align-items:center;justify-content:center;font-size:17px}
.resume-card b{display:block;font-size:15px}
.resume-card small{color:var(--ink-soft);font-size:13px}

/* ---------- sections ---------- */
.sect{padding:42px 0}
h2.sect-title{font-family:var(--serif);font-weight:700;font-size:clamp(26px,3.4vw,36px);margin-bottom:10px}
.sect-sub{color:var(--ink-soft);max-width:46em;margin-bottom:34px}

/* intro accordion */
.intro-quote{font-family:var(--serif);font-size:clamp(21px,2.6vw,27px);font-style:italic;line-height:1.5;color:var(--wine-deep);border-left:4px solid var(--yellow);padding:6px 0 6px 26px;max-width:30em;margin:8px 0 26px}
.prose p{margin:0 0 1.15em;max-width:44em}
.prose p:last-child{margin-bottom:0}
.readmore{background:none;border:none;color:var(--wine);font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center;padding:6px 0}
.readmore:hover{text-decoration:underline}

/* ---------- state cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
.scard{position:relative;display:flex;flex-direction:column;gap:13px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px 20px;text-decoration:none;color:var(--ink);transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--wine-mid)}
.scard .num{position:absolute;top:18px;right:20px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);opacity:.7}
.scard .icon{width:46px;height:46px;border-radius:14px;background:var(--wine-soft);color:var(--wine);display:flex;align-items:center;justify-content:center;font-size:22px}
.scard h3{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.2}
.scard .hook{font-size:14px;color:var(--ink-soft);line-height:1.55;flex:1}
.scard .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--wine)}
.bar{height:5px;border-radius:999px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--wine));border-radius:999px;transition:width .4s}
.scard.done-all{border-color:var(--yellow)}
.badge-done{display:inline-flex;align-items:center;gap:5px;background:var(--yellow-soft);color:var(--wine-deep);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px}

/* ---------- quiz ---------- */
.quiz-wrap{max-width:660px;margin:54px auto 0}
.quiz-card{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:42px 44px;box-shadow:var(--shadow-lg)}
@media(max-width:560px){.quiz-card{padding:30px 22px}}
.q-step{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--wine);margin-bottom:14px}
.q-dots{display:flex;gap:7px;margin-bottom:30px}
.q-dots i{width:34px;height:5px;border-radius:99px;background:var(--line);transition:.3s}
.q-dots i.on{background:var(--yellow)}
.q-dots i.cur{background:var(--wine)}
h3.q-title{font-family:var(--serif);font-size:clamp(22px,3vw,28px);font-weight:700;line-height:1.3;margin-bottom:26px}
.q-opt{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;background:var(--cream);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15.5px;line-height:1.5;color:var(--ink);margin-bottom:11px;transition:.16s}
.q-opt:hover{border-color:var(--wine);background:var(--wine-soft);transform:translateX(3px)}
.q-opt .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;transition:.16s;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.q-opt:hover .tick{border-color:var(--wine)}
.q-opt.picked{border-color:var(--wine);background:var(--wine-soft)}
.q-opt.picked .tick{background:var(--wine);border-color:var(--wine);color:var(--cream)}
.q-back{background:none;border:none;color:var(--ink-soft);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;margin-top:8px}
.q-back:hover{color:var(--wine)}
/* result */
.result{text-align:center;padding:10px 0}
.result .icon-big{width:84px;height:84px;margin:0 auto 22px;border-radius:26px;background:linear-gradient(135deg,var(--wine),var(--wine-deep));color:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:var(--shadow-lg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.result .r-kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--wine);margin-bottom:10px}
.result h3{font-family:var(--serif);font-size:clamp(28px,4vw,38px);font-weight:800;margin-bottom:16px}
.result p.desc{color:var(--ink-soft);text-align:left;margin:0 auto 22px;max-width:36em}
.runnerup{font-size:14px;color:var(--ink-soft);margin-bottom:28px}
.runnerup a{font-weight:700}

/* ---------- course page ---------- */
.crumbs{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-soft);padding:26px 0 0;flex-wrap:wrap}
.crumbs a{color:var(--ink-soft);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--wine)}
.crumbs .sep{opacity:.5}
.course-hero{padding:38px 0 8px;display:grid;grid-template-columns:1fr;gap:8px;max-width:760px}
.course-hero .icon-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.course-hero .icon-row .icon{width:54px;height:54px;border-radius:16px;background:var(--wine);color:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:26px}
.course-hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(32px,4.6vw,52px);line-height:1.08}
.course-hero .sub{font-size:18px;color:var(--ink-soft);max-width:36em;margin-top:14px}
.tagrow{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 6px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink-soft)}
.tag .ic{color:var(--wine)}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:34px;align-items:start;margin-top:36px}
@media(max-width:860px){.two-col{grid-template-columns:1fr}}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:28px 30px;box-shadow:var(--shadow)}
.panel h4{font-family:var(--serif);font-size:20px;margin-bottom:14px}
.panel ul{list-style:none}
.panel ul li{display:flex;gap:11px;margin-bottom:12px;font-size:15px;line-height:1.6}
.panel ul li .ic{color:var(--wine);margin-top:5px}
.panel.who{background:var(--wine-soft);border-color:transparent}
.panel.who p{font-size:15px;margin-bottom:12px}
.startend{margin-top:18px}
.startend .se{display:flex;gap:12px;font-size:15px;margin-bottom:14px}
.startend .se b{color:var(--wine)}
.startend .se .ic{margin-top:5px;color:var(--wine);flex:none}

/* modules */
.modules{margin-top:46px}
.module{background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow)}
.module-head{display:flex;align-items:center;gap:16px;width:100%;background:none;border:none;text-align:left;padding:22px 26px}
.module-head .mnum{font-family:var(--serif);font-style:italic;font-weight:700;font-size:15px;color:var(--cream);background:var(--wine);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.module-head h4{font-family:var(--serif);font-size:20px;font-weight:700}
.module-head small{display:block;color:var(--ink-soft);font-size:13.5px;font-weight:400;margin-top:2px;font-family:var(--sans)}
.module-head .chev{margin-left:auto;color:var(--ink-soft);transition:.25s;font-size:18px}
.module.open .chev{transform:rotate(180deg)}
.module .lessons{display:none;border-top:1px solid var(--line)}
.module.open .lessons{display:block}
.lrow{display:flex;align-items:center;gap:14px;padding:15px 26px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);transition:.15s;font-size:15px}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--cream)}
.lrow .st{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;transition:.2s}
.lrow.done .st{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.lrow .lid{font-size:12px;font-weight:700;color:var(--wine);width:34px;flex:none}
.lrow .lt{flex:1;font-weight:600}
.lrow .kind{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--wine-deep);background:var(--yellow-soft);border-radius:99px;padding:3px 10px;flex:none}
.lrow .go{color:var(--ink-soft);font-size:15px}

/* ---------- lesson page ---------- */
.lesson-wrap{max-width:1130px;margin:0 auto}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:46px;align-items:start}
.lesson-main{max-width:760px;min-width:0}
.side-journal{position:sticky;top:84px;max-height:calc(100vh - 104px);display:flex;flex-direction:column}
.side-journal .journal{margin:0;padding:22px 22px 18px;display:flex;flex-direction:column;overflow:hidden}
.side-journal textarea{min-height:240px;flex:1}
@media(max-width:980px){.lesson-grid{grid-template-columns:1fr}.side-journal{position:static;max-height:none;margin-top:8px}}
.lesson-head{max-width:760px;padding:34px 0 6px}
.lesson-head .lk{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--wine);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lesson-head .lk .pill{background:var(--yellow-soft);color:var(--wine-deep);padding:3px 11px;border-radius:99px;letter-spacing:.06em}
.lesson-head h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,4.2vw,44px);line-height:1.12;margin-bottom:18px}
.objective{display:flex;gap:13px;background:var(--wine-soft);border-radius:14px;padding:17px 20px;font-size:15px;line-height:1.6;margin:6px 0 30px}
.objective .ic{color:var(--wine);font-size:19px;margin-top:4px;flex:none}
.objective b{color:var(--wine-deep)}

/* video */
.video{margin:8px 0 34px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-lg);background:var(--white);border:1px solid var(--line)}
.vstage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#3b0c22}
.vgrad{position:absolute;inset:-40%;background:
  radial-gradient(42% 52% at 28% 36%,#fbb922cc 0%,#fbb92200 60%),
  radial-gradient(50% 60% at 72% 64%,#b03060c4 0%,#b0306000 65%),
  radial-gradient(60% 70% at 55% 25%,#811d47 0%,#811d4700 70%),
  linear-gradient(130deg,#5c1232 0%,#811d47 45%,#a82d5c 75%,#5c1232 100%);
  animation:drift 26s ease-in-out infinite alternate;filter:saturate(1.05)}
.video.playing .vgrad{animation-duration:9s}
@keyframes drift{
  0%{transform:translate(0,0) rotate(0deg) scale(1)}
  50%{transform:translate(6%,-5%) rotate(6deg) scale(1.12)}
  100%{transform:translate(-6%,5%) rotate(-5deg) scale(1.05)}}
.vgrain{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(rgba(255,253,244,.5) .6px,transparent .6px);background-size:22px 22px}
.vplay{position:absolute;inset:0;width:100%;border:none;background:rgba(42,42,42,.0);display:flex;align-items:center;justify-content:center;transition:.2s}
.vplay:hover .vbtn{transform:scale(1.07)}
.vbtn{width:76px;height:76px;border-radius:50%;background:var(--cream);color:var(--wine);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 32px rgba(0,0,0,.35);transition:.2s;padding-left:5px}
.vbtn.pause{padding-left:0}
.video.playing .vplay{opacity:0}
.video.playing .vplay:hover{opacity:1;background:rgba(42,42,42,.25)}
.vmeta{position:absolute;left:0;right:0;bottom:0;padding:38px 20px 14px;background:linear-gradient(transparent,rgba(30,5,17,.72));color:var(--cream);display:flex;align-items:flex-end;gap:12px;pointer-events:none}
.vmeta .vt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.3;flex:1;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.vmeta .vd{font-size:12px;font-weight:700;background:rgba(255,253,244,.18);border:1px solid rgba(255,253,244,.35);backdrop-filter:blur(4px);border-radius:99px;padding:3px 11px;white-space:nowrap}
.vbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,253,244,.22)}
.vbar i{display:block;height:100%;width:0;background:var(--yellow)}
.vtab{display:flex;align-items:center;gap:10px;width:100%;background:var(--white);border:none;border-top:1px solid var(--line);padding:14px 20px;font-size:14px;font-weight:700;color:var(--wine);letter-spacing:.02em}
.vtab:hover{background:var(--wine-soft)}
.vtab .chev{margin-left:auto;transition:.25s;color:var(--ink-soft)}
.vtab[aria-expanded="true"] .chev{transform:rotate(180deg)}
.vscript{display:none;border-top:1px solid var(--line);background:var(--cream);padding:26px 28px;font-size:15px}
.vscript.open{display:block}
.vscript p{margin-bottom:1em;max-width:42em}
.vscript .stage{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--wine);background:var(--wine-soft);border-radius:7px;padding:3px 10px;margin-bottom:2px}

/* lesson prose */
.lesson-body{font-size:17px}
.lesson-body>p{margin-bottom:1.25em}
.lesson-body>p.opener::first-letter{font-family:var(--serif);font-weight:800;font-size:3.3em;float:left;line-height:.82;padding:6px 10px 0 0;color:var(--wine)}
.callout{border-radius:16px;padding:24px 26px;margin:30px 0;font-size:16px}
.callout .c-label{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
.callout.practice{background:var(--yellow-soft);border:1px solid #f3dba4}
.callout.practice .c-label{color:#8a6105}
.callout.reflect{background:var(--wine-soft);border:1px solid #e5cdd9}
.callout.reflect .c-label{color:var(--wine)}
.callout p{margin-bottom:1em}.callout p:last-child{margin-bottom:0}
.callout b.pname{font-weight:800;color:var(--wine-deep)}

/* journal */
.journal{margin:36px 0;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;box-shadow:var(--shadow)}
.journal h4{font-family:var(--serif);font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.journal h4 .ic{color:var(--wine)}
.journal small{color:var(--ink-soft);display:block;margin-bottom:14px;font-size:13.5px}
.journal textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;background:var(--cream);padding:14px 16px;font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--ink);resize:vertical;transition:.15s}
.journal textarea:focus{outline:none;border-color:var(--wine);background:var(--white)}
.journal .saved{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-top:8px;height:18px;display:flex;align-items:center;gap:6px;opacity:0;transition:.3s}
.journal .saved.show{opacity:1;color:#3e7d3e}

/* lesson footer nav */
.lfoot{display:flex;align-items:center;gap:14px;margin-top:44px;padding-top:30px;border-top:1px solid var(--line);flex-wrap:wrap}
.lnav{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--white);transition:.16s;max-width:46%}
.lnav:hover{border-color:var(--wine);color:var(--wine)}

<script>
const DATA = {"intro": ["Introduction", "Introduction", "I want to ask you something before we go any further.", "Not a big question. Not the one that requires a journal and an hour alone. Just this: is something off?", "Not wrong, exactly. Not broken. Not crisis-level. Just off. Like a note that's slightly flat in an otherwise familiar song. Like a morning where you do everything right and still feel, somewhere underneath the accomplishment, a quiet, persistent question you can't quite name.", "If you know that feeling, you're in the right place.", "A few years ago, I was sitting in a coaching session at Stanford GSB—of all places, in the middle of my new professional chapter—and I heard myself say something I hadn't planned to say: \"I'm measuring my life against an old story.\"", "I was rating my life as mediocre. My actual, extraordinary, hard-won, deeply loved life—mediocre. Four out of ten, area by area. And it took a coaching partner, a quiet room, and a Wheel of Life assessment to finally make visible what had been running in the background for years: the scoring system was broken. I was measuring who I am now against a version of myself that no longer existed. A version that, if I'm being honest, I wasn't even that happy about being.", "That moment became the foundation of everything I've built since—the The Alignment Check, the framework, the writing, and the coaching. The core insight is simple: we are all living by a story we wrote about ourselves years ago, and most of us have never stopped to check if it's still true.", "But here's the thing I've learned since then, through years of writing, coaching, and honest conversation with women in midlife who are doing the inner work: the road from the old story to the new one has multiple entry points.", "You don't always start at the beginning. You don't always start with the grand realization. Sometimes you start in the middle of something. Sometimes you start with a feeling you can't quite name. Sometimes you start with a thought that arrived while you were standing under studio lights waiting to be cued, or driving your kids to school, or lying awake at 3am wondering why the version of your life that looks great from the outside feels somehow incomplete on the inside.", "I've been studying these entry points. I've come to think of them as states —specific, recognizable, nameable experiences that tend to show up on the journey from old story to new. Not stages, exactly, and not a linear sequence. More like different rooms in the same house. You might be in one of them. You might be moving between two. You might read the descriptions below and feel a specific recognition—that's me, that's the one —or you might feel pulled toward several at once.", "Both are fine. Both are real. The work is the same regardless of where you enter.", "Consider seeing which state you are in: Which State Are You In ?", "Which State Are You In"], "whichState": ["Which State Are You In?", "Eight moments on the road from your old story to your new one—and how to find where you are", "The Hum is the quietest one. It's not a crisis. It's not a complaint you could put words to at a dinner party. It's a low-grade, persistent signal—a sense that something in your life isn't quite aligned, that there's a \"is this it?\" underneath the days that otherwise look exactly right. You have the life. You love pieces of it. And yet. The Hum doesn't shout. It just keeps showing up, reliably, in the quiet moments between the obligations.", "The Guilt Loop is the one that makes you feel bad for having the Hum. You notice the dissatisfaction, and then you notice yourself noticing it, and then comes the shame: I have no right to feel this. I have so much. What is wrong with me? And so you push it down. And it comes back. And the cycle starts again—dissatisfaction, shame, suppression, return—quietly exhausting, almost invisible to anyone watching from the outside.", "The Comparison Spiral arrives on a Tuesday afternoon, usually in the form of someone else's LinkedIn post. She's doing what you were going to do. Or something close enough to feel like overlap. And you feel the door close slightly—just slightly — and before you know it, you've moved your own work one step further back in the queue. Can we both exist here? It's the question you'd be embarrassed to say out loud. And yet.", "The Freeze is the mid-action stall. You decided. You started. And then something—a voice, a comparison, a moment of doubt that arrived at exactly the wrong time — made it feel unsafe to continue. You didn't decide to stop. You just... stopped. The document is still open. The idea is still there. But there's a gap between the last time you touched it and now, and the gap has been quietly growing.", "The Past-Tense Trap is the one where the language gives you away. I used to be a national TV anchor. I lived in New York. I had a pretty exciting life. Not lies—all true, once. But you are still introducing yourself with the old version. Still measuring the present against the person you were, the career you had, the city you left. Still carrying a title long after you turned in the badge. The present tense feels insufficient, somehow. The new story doesn't have a name yet.", "The Spark is the one that doesn't ask permission. It arrives through the haze of a Wednesday when you've been doing everything right, doing everything fine, and a thought lands: I can do more. Not louder, not more impressive — just more. More aligned, more yours, more like the thing you were built for. The thought stays. You're not sure whether to trust it or dismiss it. You're not sure if it's wisdom or ego. But it won't quite leave.", "The Messy Middle is where you are if you already took the step — you decided, you started, you made the change — and now you're in the stretch that no one warned you about. The unglamorous, uncertain, signal-free stretch between the decision and the arrival. It doesn't look like progress. It's the letters L, M, N, O, P on the way from A to Z. You're still going. You're just not sure when you'll arrive, or what you'll find when you do.", "The Landing That Doesn't Match the Old Picture is the most disorienting one. Because you did arrive. You built something real. You moved through the middle and came out the other side, and what you built is genuinely good — you know this, you're grateful for it. And yet you keep finding it somehow insufficient, because you're still measuring it against the picture you built ten or twenty years ago, for a version of yourself who no longer exists. The scoring system is broken, not the life.", "So. Which room are you in?", "Maybe you read one of those descriptions and felt the particular relief of being named — the recognition that comes when someone else has put words to the thing you've been carrying quietly. Or maybe you read two or three and felt pulled toward several at once, which is also true and also fine, because these states aren't mutually exclusive and the road from old story to new is rarely a straight line.", "Trust the one that landed. Or the two. Or the one you most wanted to skip over, which is usually the most important one.", "Each of these states has its own course — its own lessons, practices, and video scripts — built entirely from my own written essays and lived experience. Every exercise I offer, I've done myself. Every framework I give you, I built from my own unglamorous time in exactly that room.", "You don't have to do all eight. You don't have to start at the beginning or end at the end. You just have to start where you are.", "The old story has been running long enough.", "The new one starts from today.", "xx Shibani", "Want to find your state? Read the descriptions again slowly. Notice which one makes you feel slightly more seen than you expected. That's probably your entry point.", "Or, if you already know, just begin.", "Go to: 1. The Hum 2. The Guilt Loop 3. The Comparison Spiral 4. The Freeze 5. The Past-Tense Trap 6. The Spark 7. The Messy Middle 8. The Landing That Doesnʼt Match the Old Picture"], "stateDescriptions": {"The Hum": "The Hum is the quietest one. It's not a crisis. It's not a complaint you could put words to at a dinner party. It's a low-grade, persistent signal—a sense that something in your life isn't quite aligned, that there's a \"is this it?\" underneath the days that otherwise look exactly right. You have the life. You love pieces of it. And yet. The Hum doesn't shout. It just keeps showing up, reliably, in the quiet moments between the obligations.", "The Guilt Loop": "The Guilt Loop is the one that makes you feel bad for having the Hum. You notice the dissatisfaction, and then you notice yourself noticing it, and then comes the shame: I have no right to feel this. I have so much. What is wrong with me? And so you push it down. And it comes back. And the cycle starts again—dissatisfaction, shame, suppression, return—quietly exhausting, almost invisible to anyone watching from the outside.", "The Comparison Spiral": "The Comparison Spiral arrives on a Tuesday afternoon, usually in the form of someone else's LinkedIn post. She's doing what you were going to do. Or something close enough to feel like overlap. And you feel the door close slightly—just slightly — and before you know it, you've moved your own work one step further back in the queue. Can we both exist here? It's the question you'd be embarrassed to say out loud. And yet.", "The Freeze": "The Freeze is the mid-action stall. You decided. You started. And then something—a voice, a comparison, a moment of doubt that arrived at exactly the wrong time — made it feel unsafe to continue. You didn't decide to stop. You just... stopped. The document is still open. The idea is still there. But there's a gap between the last time you touched it and now, and the gap has been quietly growing.", "The Past-Tense Trap": "The Past-Tense Trap is the one where the language gives you away. o change", "A 7-lesson course built from the The Alignment Check, for the moment when nothing is visibly wrong but something inside you keeps whispering: \"Is this it?\""], "promise": ["By the end of this course, you will be able to:", "• Recognize the Hum — the low, constant \"is this it?\" signal — as an intelligent message rather than a character flaw, a symptom of ingratitude, or proof that something is wrong with you", "• Trace the Hum back to its actual source: a scoring system built for someone you used to be, measuring a life you've long since outgrown", "• Separate the transitory roles and titles you've organized your identity around from the permanent, untouchable self that has always been underneath them", "• Begin drafting a new story — not from the highlight reel of your past, but from the truth of who you are and what makes you happy right now", "This is not a course about becoming happier by changing your circumstances. It's a course about discovering that the scoring system itself is broken — and learning to build a new one from the ground you're actually standing on."], "who": ["The person whose life looks, from the outside, exactly like what she wanted. The person with the résumé, the children, the house, the city, the job title — and a quiet, persistent feeling underneath all of it that keeps asking a question she can't quite answer. Not unhappiness, exactly. Not crisis. More like a low-grade hum: steady, familiar, easy to dismiss, impossible to fully silence.", "The person who feels vaguely guilty for feeling this at all. Who tells herself she has too much to complain about, that others have it harder, that she should be grateful — and then, somehow, still feels the hum.", "If that is where you are right now, this is not the course that will tell you what to change. It is the course that will help you finally understand what the hum is trying to tell you. And that changes everything."], "startEnd": ["Start: The life looks good on paper. But something inside keeps asking a question you can't fully form, about a feeling you can't fully name — and that you've learned to dismiss quickly, before you have to explain it to anyone.", "End: You understand that the hum was never a problem with your circumstances. It was a problem with your measuring stick—and you've begun building a new one. You have named the version of yourself your old story was built for, thanked her for what she gave you, and taken the first steps toward a story that starts from where you actually are."], "resources": ["Every lesson in this course is built directly on Shibani's own published essays — most centrally \"Seeing Ourselves as More Than Our Jobs\" (the 2016 meditation retreat in San Diego, the blank-paper cross-off exercise, \"what's in you can never leave,\" \"I felt I didn't have the right to complain\"), \"Is It Time for a New Story?\" (the Stanford GSB Wheel of Life moment, \"I'm measuring my life against an old story,\" \"I wasn't even all that happy then. I'm much happier now\"), and \"Learning How to Manage My Mind\" (the garden and leaky faucet metaphor, \"our thoughts are the vibrational soil from which our lives sprout\"). The Hum is the signal that precedes the The Alignment Check itself — and these are the essays where Shibani first learned to hear it."], "modules": [{"num": 1, "title": "Hear It", "tagline": "Naming the hum without immediately trying to silence it", "lessons": [{"id": "1.1", "title": "The Life That Looks Fine", "objective": "By the end of this lesson, you can name the hum — the low, persistent \"is this it?\" feeling — as a real signal rather than a character flaw, and begin noticing where it appears in your own life.", "video": {"title": "The Life That Looks Fine\" 90", "paragraphs": ["OPEN ON SHIBANI", "I want to tell you about a weekend retreat I attended in 2016, because it's the clearest picture I have of what the hum looks like when you've been ignoring it for a long time.", "To anyone looking in: privileged, ideal, happy. A beach city. Beautiful kids. A career that had mattered. Lots to be grateful for.", "And yet. I had driven hours to sit with strangers for a weekend because something wouldn't stop asking a question I couldn't quite form. Not crisis. Not failure. Just a low, constant \"is this it?\" I couldn't shake.", "On the first morning, we were given a blank paper and asked: \"Who are you?\"", "I sat there. Others scribbled. I stared.", "I didn't know who I was anymore.", "My life had turned into a series of past tenses: I was a national TV news anchor. I used to live in New York. I used to have a game plan.", "Here's what I want you to understand about the hum: it is not a verdict. It's not proof you're ungrateful, or broken, or failing. It's a signal — like a warning light on a dashboard. It isn't the problem. It's pointing to one.", "A life can look absolutely fine from the outside and still be humming underneath. The hum doesn't arrive at crisis volume. It stays quiet enough to dismiss, loud enough never to fully disappear.", "So here's your practice. For the next three days, notice the moments the hum shows up — not the loud ones, the quiet ones. The moment you zone out mid-dinner. The Sunday evening feeling. Write it down. No fixing yet. Just noticing.", "FADE OUT"]}, "type": "lesson", "_body": ["I want to tell you about a weekend retreat I attended in San Diego in October 2016, because it's the clearest picture I have of what the hum looks like when you've been ignoring it for a very long time.", "To an outsider, my life would have looked privileged, ideal, and happy. I was living near the beach. My children were beautiful and young and healthy. My career was significant by any reasonable measure. There was, genuinely, so much to be grateful for.", "And yet.", "The reason I had driven hours to sit in a room with strangers for a weekend was that something inside me wouldn't stop asking a question I couldn't quite form. Not crisis — nothing had collapsed. Not failure — the life was intact, even good, on every visible measure. Just a low, constant is this it? that I couldn't shake, no matter how many times I reminded myself how much I had.", "On the first morning, we were given a blank piece of paper and asked to write down our answers to a single question: \"Who are you?\"", "I sat there unable to write. Others around me scribbled quickly, filling their pages. I stared at mine.", "I didn't know who I was anymore.", "In leaving New York City two years earlier, my life had turned into a series of past tenses: I was a national TV news anchor. I used to live in New York. I used to have a game plan. And now, in a beautiful beach city with three young children and a career that had gone quiet, the hum was all I could hear — low, steady, impossible to fully name.", "Here's what I want you to understand about the hum: it is not a verdict. It is not proof that you're ungrateful, or broken, or failing in some essential way. It is, quite simply, a signal — the way a warning light on the dashboard is a signal. It isn't the problem. It's telling you there is one.", "The harder truth — and the one I sat with for years before I finally gave it the attention it deserved — is that a life can look absolutely fine from the outside and still be humming underneath. The hum doesn't announce itself at crisis volume. It stays quiet enough to dismiss, loud enough never to fully disappear. And it shows up, often, in the gap between how your life looks on paper and how it actually feels to live it from the inside.", "So here is your practice this week.", "Hum Inventory. For the next three days, notice the moments the hum shows up — not the loud, obvious moments, but the quiet ones. The dinner-table conversation where you zone out midway through. The moment you check your phone not because you're expecting anything, but because you can't quite stand to be fully present. The feeling in your chest at Sunday evening, before the week starts again. When you notice one, write it down: where were you, what were you doing, and what was the hum quietly asking?", "No fixing yet. No explaining. Just noticing—the way you'd notice a sound in the walls, if you finally decided to actually listen for it.", "Reflect: When did you first start hearing the hum? Not the moment it got loudest — the first time you can remember it being there, quietly, underneath everything else."]}, {"id": "1.2", "title": "The Guilt That Comes With It", "objective": "By the end of this lesson, you can separate the hum from ingratitude — understanding why they feel identical from the inside, and why they are completely different things.", "video": {"title": "The Guilt That Comes With It\" 90", "paragraphs": ["OPEN ON SHIBANI", "There's a sentence I said to myself for years, in different forms, before I finally noticed I was doing it: I don't have the right to feel this.", "It would show up right behind the hum, every time. A split second after \"is this it?\" — the second thought would land: look at everything you have. What is wrong with you? And I'd push the feeling back down, and go back to gratitude, and try harder to feel what I was supposed to feel.", "At the retreat I've described — sitting with tears on my face, blank piece of paper in front of me — I felt it clearly: with everything I had, I felt I didn't have the right to complain. Worse yet — I felt guilty, because it could mean I was ungrateful.", "But here's what I've come to understand: guilt is not the same thing as ingratitude. And the hum is not a complaint.", "You can be deeply, genuinely grateful for your life — and still hear the hum. In fact, the hum is most common in people who can see what they have, and still feel the quiet signal underneath. The hum isn't saying \"what you have isn't enough.\" It's saying: \"what you have doesn't match what you are. \" That's a completely different question.", "The guilt, I've come to see, is the old story's way of keeping you from looking too closely at its foundations.", "So here's your practice. Write a short letter to the hum — two to four paragraphs. Tell it what you've been saying to it: \"I've been telling myself you're ingratitude. I've been telling myself I don't have the right to take you seriously.\" Then add one more line: \"But I'm listening now.\"", "FADE OUT"]}, "type": "lesson", "_body": ["There is a sentence I said to myself for years, in different forms, before I finally recognized what I was doing:", "I don't have the right to feel this.", "It would show up right behind the hum, every time. A split second after the \"is this it?\" — before I'd even fully registered the feeling — the second thought would land: what is wrong with you? Look at everything you have. And so I'd push the hum back down, and go back to gratitude, and try harder to feel what I was supposed to feel.", "I was doing exactly this at the San Diego retreat. Sitting with tears on my face, blank piece of paper in front of me. To an outsider, my life may have looked privileged, ideal, and happy. And that was exactly the problem. With my privilege and capabilities, I felt I didn't have the right to complain. Worse yet, I felt guilty for complaining — because it could show that I was ungrateful.", "I want to name this clearly, because I think it's the thing that keeps the most people from ever taking the hum seriously: guilt is not the same thing as ingratitude. And the hum is not a complaint.", "Gratitude is real, and beautiful, and essential. You can be deeply, genuinely grateful for your life and still hear the hum. In fact, I'd argue that the hum is most common in people who are quite capable of gratitude — people who can see all that they have, and still feel the quiet signal underneath it. The hum isn't saying \"what you have isn't enough.\" It's saying: \"what you have doesn't match what you are. \" That's a completely different question.", "The guilt, I've come to understand, is itself a symptom of the old story. It says: you built this life, you chose it, you should be satisfied by it. And if you're not satisfied — if some signal keeps whispering that something is off — then there must be something wrong with you , not with the story. The guilt is the old story's way of making sure you don't look too closely at its foundations.", "So here is your practice.", "Letter to the Hum. Write a short, honest note to the signal—two to four paragraphs, like a letter to a person you've been avoiding. Tell it what you've been saying about it to yourself: \"I've been telling myself you're ingratitude. I've been telling myself I don't have the right to take you seriously. I've been telling myself you're a problem with me, not a message for me.\"", "Then write one more line: \"But I'm listening now.\"", "You don't have to know yet what the hum is trying to tell you. You only have to stop telling it to be quiet.", "Reflect: When you hear the hum and immediately feel guilt — whose voice is the guilt in? Whose standard is it enforcing?"]}, {"id": "check-1", "title": "Hearing vs. Suppressing", "objective": "", "video": null, "type": "checkin", "module": 1, "_body": ["Learning objective tested: Distinguishing between someone who is genuinely at peace with her life and someone who is quietly suppressing a real signal.", "Scenario. A friend tells you: \"Honestly, I have nothing to complain about. I know that sounds weird to say, but I really am grateful for everything I have. I just sometimes wonder if... never mind, it's nothing.\"", "Question. Based on what you've learned in Module 1 what is the \"never mind, it's nothing\" doing in that sentence? And what's one question you might ask that gently opens the door — rather than closing it with reassurance?", "A way to think it through: Notice the sentence structure: she established her gratitude first, then said something was wrong with thinking anything differently — and then cut herself off. That's the hum doing exactly what it does: it appears just long enough to almost be named, and then gets dismissed by the guilt that follows it. The \"never mind\" isn't proof that nothing is there. It's proof that she's learned to silence it quickly.", "A question that opens rather than closes might sound like: \"What were you about to say before the 'never mind'?\" That question doesn't tell her the hum means something is wrong. It just invites her to finish the sentence she started."]}]}, {"num": 2, "title": "Understand It", "tagline": "Why the hum is intelligent, not shameful", "lessons": [{"id": "2.1", "title": "The Wrong Scoring System", "objective": "By the end of this lesson, you can identify the specific old story your hum is measuring against — the past version of yourself whose standards you've been applying to a life that no longer looks anything like hers.", "video": {"title": "The Wrong Scoring System\" 90", "paragraphs": ["OPEN ON SHIBANI", "In early 2024, in a coaching session at Stanford, I did a Wheel of Life assessment — rating eight areas of my life on satisfaction. My scores were mediocre across the board.", "When my coach asked why, I heard myself say something I hadn't planned: \"I'm measuring my life against an old story.\"", "The old story: the Fox Business anchor, ten years younger, living in New York City with her husband and kids. Fashion Week parties. A career on television every night.", "For health, I docked points because I wasn't at my college weight. For career, because I wasn't on national TV. For family, because I was no longer in an intact marriage.", "My coach asked: \"How does this make you feel?\"", "\"Depressed. Sad. Actually angry.\"", "\"Why?\"", "\"Because this is actually not true. My life is extraordinary — but it isn't showing up here.\"", "And then: \"I wasn't even all that happy then. I'm much happier now.\"", "Read that again. I was measuring my current life against a past self who wasn't even that happy — and scoring myself a failure. That's not ingratitude. That's a mathematical error.", "So here's your practice. Sketch the \"peak version\" of yourself that your hum keeps measuring against. Where does she live? What does she do? Then ask: is this actually what you want, now, in this season? And — was she as happy as the standard she's become?", "FADE OUT"]}, "type": "lesson", "_body": ["Here is what I said, out loud, in a coaching session at Stanford in early 2024 — to someone who was essentially a stranger, after rating my own life mediocre across almost every category:", "\"I'm measuring my life against an old story.\"", "I hadn't planned to say it. It arrived the way the truest things usually do — not from thinking but from suddenly hearing myself speak. And once I heard it, I couldn't un-hear it.", "The old story: the Fox Business anchor, ten years younger, thinner, living in New York City with her husband and her children. A social calendar booked out for weeks with Fashion Week parties and work cocktails. A career that arrived on TV every night. A life that, from the outside, looked like the pinnacle of everything I'd worked toward.", "I was measuring my current life against that life — against a version of myself I no longer was, in a city I no longer lived in, in a marriage I was no longer in, with a career that had shifted into something neither better nor worse but simply different. And every time my current life didn't match that old picture, my scoring went down. For health, my score dropped because I wasn't at my college weight. For career, it dropped because I wasn't on national television. For family, it dropped because I was no longer in an intact marriage.", "\"I see that the only way I can rate myself a 10 is by hitting it out of the park,\" I said. \"I have to be at a peak in order to be at my happiest.\"", "My coach's next question was: \"How does this make you feel?\"", "\"Depressed. Sad. Actually angry,\" I said.", "\"Why?\"", "\"Because this is actually not true. My life is not mediocre. My life is extraordinary, but it isn't showing up here.\"", "And then, quietly: \"I wasn't even all that happy then. I'm much happier now.\"", "Let me say that again slowly: I was using the old story as my measuring stick — scoring my current life against a past self who wasn't even all that happy — and then feeling like I was failing. That's not ingratitude. That's a mathematical error.", "Here's your practice this week.", "Scoring System Audit. Think about the \"peak version\" of yourself that your hum seems to be measuring against. Write a brief sketch of her: Where does she live? What does she do for work? What does her life look like from the outside? Then ask honestly: is this actually what you want right now, in the life and season you're currently in? And finally — was she as happy as the standard she has become?", "Reflect: If you could release the old story as the benchmark, what would you choose to measure your life against instead?"]}, {"id": "2.2", "title": "The Anchor and the Self", "objective": "By the end of this lesson, you understand the difference between the roles you play and the self underneath them — and can begin to sense what remains when all the transitory identities are crossed off.", "video": {"title": "The Anchor and the Self\" 90", "paragraphs": ["OPEN ON SHIBANI", "At that retreat in San Diego, after we'd written our lists of who we were, the instructor said: \"If your role or quality can shift — by death, divorce, or any change in circumstances — cross it off.\"", "Slowly, I crossed everything off.", "Mother. Journalist. Spiritual. Wife. Former New Yorker. Gone, one by one.", "I was left with nothing. Like the blank piece of paper I'd started with. Empty. Exactly how I felt inside.", "Then she said something I've returned to at every point where the hum grew loudest: \"Who we are never changes. What's in you, can never leave.\"", "What landed wasn't comfort — it was recognition. The hum wasn't evidence of failure. It was the gap between all those transitory roles — the ones I'd built my whole identity around — and the self underneath them that had never needed any of those roles to be whole.", "We build a life around identities that can be crossed off — the job, the city, the marriage, the body — and when those shift or end, we hear the hum and mistake it for something breaking. But what's humming is the self underneath, asking for some attention.", "So here's your practice. On a blank piece of paper, write every identity you'd give if asked \"who are you?\" Then cross off everything that could change through death, divorce, job loss, the passage of time. What remains? Sit with that. Write whatever comes.", "FADE OUT"]}, "type": "lesson", "_body": ["At that retreat in San Diego, after we'd written our lists of who we were, the instructor asked us to do something I wasn't expecting. \"Now, look at your writing. If your adjective, quality, or role can shift in any way — by death, divorce, or change in circumstances — cross it off.\"", "Slowly, I found a way to cross everything I'd defined myself by off my list.", "Mother — crossed off. A mother who is no longer living doesn't stop existing, but the role can be taken from her. Spiritual — crossed off. I could lose my faith tomorrow. Journalist — crossed off. I had already stopped working full-time. Wife — crossed off. Former New Yorker — crossed off. Each identity that had felt like bedrock, stripped away in minutes.", "I was left with nothing. Like the blank piece of paper with which I'd started. Empty. Exactly how I was feeling inside.", "And then the instructor said something I have carried with me ever since, at every point where the hum grew loudest: \"Who we are never changes. What's in you, can never leave.\"", "What landed in my body wasn't comfort, exactly — it was something more like recognition. The thing that had been humming wasn't gone. But I could suddenly see that it wasn't evidence of failure. It was the gap between all those transitory roles — the ones I'd built my whole identity around — and the self underneath them that had never needed any of those roles to be whole.", "The hum, I began to understand, often points exactly to this gap. We build a life around identities that can be crossed off — the job, the marriage, the city, the body, the social calendar — and when those identities shift, or fade, or end, we hear the hum and mistake it for the sound of something breaking. But what's humming is the self underneath, calling for some attention. Not because the self is damaged. Because the structures built around it have gotten mistaken for it.", "Here's your practice.", "The Cross-Off. On a blank piece of paper (or in your journal), write every identity you'd give if someone asked \"who are you?\" — every role, quality, attribute, label. Then go through the list and cross off everything that could change through death, divorce, job loss, illness, moving cities, or the simple passage of time. What remains? Sit with that. Write whatever comes — or simply sit in the quiet of it, for as long as feels true.", "Reflect: Of the identities you crossed off, which one has been doing the most work as the foundation of your sense of self? What does it feel like to imagine that one being crossed off?"]}, {"id": "check-2", "title": "A Judgment Question", "objective": "", "video": null, "type": "checkin", "module": 2, "_body": ["Learning objective tested: Distinguishing between a life that needs to change and a measuring system that needs to change — and why the diagnosis matters before any action.", "Question. A friend says: \"I think the hum means I need to make a big change — quit my job, move cities, start over. If the signal is real, doesn't that mean something in my life needs to be different?\" How would you respond — without dismissing the idea of change, or agreeing that external change is automatically the right response?", "A way to think it through: The hum doesn't automatically mean your life is wrong. It means your measuring system may be wrong — which is an entirely different diagnosis, and usually a much simpler one to address. Shibani's answer at Stanford wasn't \"I need to go back to New York and get my anchor job back.\" It was: \"I'm measuring my current life against an old story that doesn't belong to this season.\" Changing the measuring stick — rather than the life — may reveal that what you actually have is much closer to what you want than the wrong scoring system was ever able to show you. Big external changes may be right for some people. But making them before you've diagnosed the measuring system risks rebuilding the same hum in a different zip code."]}]}, {"num": 3, "title": "Answer It", "tagline": "Responding to the hum with intention, not just silence", "lessons": [{"id": "3.1", "title": "Rewriting From Today", "objective": "By the end of this lesson, you can begin drafting a new story — not from the old picture or the highlight reel, but from the truth of who you are, what makes you happy, and what matters right now.", "video": {"title": "Rewriting From Today\" 90", "paragraphs": ["OPEN ON SHIBANI", "After I named the old story at Stanford — after I said \"I wasn't even all that happy then. I'm much happier now\" — my coach asked: \"So what does your new story look like?\"", "I didn't know. I'd spent so long measuring against the old picture that I'd never stopped to build a new one from where I actually was.", "So I started. Slowly. Imperfectly. With the questions that felt most honest.", "What is a good life lived — right now, from where I'm standing?", "Not where I'd been. Not where I thought I'd be. From here. This city. This age. This career as it actually is, in this season.", "I rewrote what health meant — not college weight, but strength and energy. I rewrote career success — not the anchor chair, but mission-aligned work that still let me write and teach. I rewrote my social life — not Fashion Week, but dinners with people I actually wanted to see.", "Companies iterate and recalibrate their targets. Why aren't we doing this as humans?", "You don't have to know yet what the whole new story looks like. You only have to start from the right place — today, who you are now, what actually makes you happy in the life you're living. The first draft just has to be honest.", "Here's your practice. Choose one area where you feel the hum most clearly. Write the first three sentences of a new story for it — not the one you used to tell, the one that starts right here.", "FADE OUT"]}, "type": "lesson", "_body": ["After the coaching session at Stanford — after I had named the old story and sat in the heaviness of letting her go — my coach said: \"So what does your new story look like?\"", "And I didn't know. Not yet. I'd spent so long measuring my life against the old picture that I hadn't actually stopped to ask what I wanted the new one to look like. I'd been so busy trying to match a standard I'd outgrown that I'd never built a new one from where I actually was.", "So I started. Slowly, imperfectly, with the questions that felt most honest.", "What is a good life lived, right now, from where I'm standing?", "Not from where I'd been. Not from where I thought I'd be. Not from what anyone else had or wanted or would score as a success. From here. From this city, this age, this family, this career as it actually existed — not as it had once existed or might one day exist, but as it was, right now, in this season.", "I began journaling and daydreaming and drafting. I rewrote what health meant — not college weight, but strength, flexibility, energy, the ability to keep up with my kids. I rewrote what career success looked like — not the anchor chair, but mission-aligned work that let me keep writing and speaking and teaching. I rewrote what my social life was supposed to look like — not Fashion Week, but dinners with people I actually wanted to see, in a city where I had more room to breathe than New York had ever given me.", "Companies need to iterate and recalibrate their targets. Why aren't we doing this as humans?", "You don't have to know yet what the whole new story looks like. You only have to start from the right place — from today, from who you are now, from what actually makes you happy in the life you're currently living. The first draft of a new story doesn't have to be long or certain or complete. It just has to be honest.", "Here's your practice this week.", "New Story Draft. Choose one area of your life where you can feel the hum most clearly — career, health, relationships, family, or another area of your choosing. Write the first three sentences of a new story for that area. Not the story you used to tell about it. Not the story you thought you'd be living. The one that starts right here, from who you actually are, in the actual season you're in. The first sentence might be as simple as: \"In this season of my life, a good career looks like...\"", "Reflect: Which area of your life do you think the hum has been circling most persistently? What would a new story for that area need to be true about today's you to actually land as a 10?"]}, {"id": "3.2", "title": "What the Hum Was Asking", "objective": "By the end of this lesson, you can name — in plain, direct language — the real question your hum has been circling, underneath all the guilt and the scoring and the effort to make it stop.", "video": {"title": "What the Hum Was Asking\" 90", "paragraphs": ["OPEN ON SHIBANI", "Now that you've been listening to the hum for a few lessons, I want to ask you something: what was it actually asking?", "Not \"what's wrong?\" — we're past that framing. But: what question has been underneath the \"is this it?\" all along?", "Mine took me years to land on. After all the journaling, after Stanford, I came to understand that my hum had been asking something very specific:", "Am I using my actual life to live — or am I using it to prove something to a version of myself that no longer exists?", "Every score I'd docked against the anchor chair, the New York apartment, the intact marriage — all of it had been in service of proving something to a woman who had moved on years ago without telling me.", "The question under your hum will be your own. Maybe it's about identity: who am I now, if not what my career says about me? Maybe permission: do I have the right to want something different, even though this life is good? Maybe time: how much longer am I going to wait to start the thing I actually want?", "Whatever the question is — it's been trying to get your attention for a long time.", "So here's your practice. Look back at everything you've written in this course. What question keeps appearing? Not the one you'd give in public. The one that's true in private. Write it down in one sentence.", "FADE OUT"]}, "type": "lesson", "_body": ["Now that you've been listening to the hum for a few lessons, I want to ask you something I don't want you to answer quickly: What was it actually asking?", "Not \"what was wrong?\" — we've moved past that framing. Not \"what needs to change?\" — we've diagnosed the measuring stick, not the life. But: what question has been underneath the \"is this it?\" all along?", "I want to tell you what mine was. After the Stanford coaching session, after the journaling and the daydreaming and the careful slow work of building a new story, I came to understand that my hum had been asking something very specific — something I'd been circling for years without landing on it directly:", "Am I using my actual life to live — or am I using my actual life to prove something to a version of myself that no longer exists?", "That was the question under mine. Every morning I'd scored myself against a career that wasn't quite mine, every measurement I'd taken against the New York apartment and the anchor chair and the intact marriage — all of it had been in service of proving something to a woman who had moved on years earlier without telling me.", "The question underneath your hum will be your own. It might be about identity: who am I now, if not what my career says about me? It might be about permission: do I have the right to want something different, even though this life is good? It might be about time: how much longer am I going to wait to start the thing I actually want to start?", "Whatever the question is — it's been trying to get your attention for a long time. And you owe it at least the courtesy of naming it plainly.", "The Real Question. Look back at everything you've written in this course so far — your Hum Inventory, your Letter to the Hum, your Scoring System Audit, your Cross-Off, your New Story Draft. What question keeps appearing? Not the question you'd give in public. The one that's true in private. Write it down in one sentence.", "Reflect: Now that you've named it — does it feel smaller, or larger, than you expected?"]}, {"id": "3.3", "title": "The First Line", "objective": "By the end of this lesson, you can write a single, true, generous sentence — the first line of a new story — that earns a 10 on its own terms, beginning exactly where you actually are.", "video": {"title": "The First Line\" 90", "paragraphs": ["OPEN ON SHIBANI", "There's one more thing I want you to do. It's the smallest thing on this list — and the one that matters most.", "Write the first line of a new story.", "Not a long one. One sentence. The first line of a story that begins from today — not from the old picture. One sentence that is true, generous to who you actually are right now, and that earns a 10 by your own standards instead of the old ones.", "Here's what mine sounded like: I am a woman in my late forties, in a city that gives me room to breathe, doing work that is mission-aligned and meaningful, raising three children who are growing into themselves, writing a book that is finding its shape.", "No anchor chair. No New York. Just the truth of the actual life, told kindly.", "When I read it back, something shifted. The life it described wasn't a smaller version of the old one. Not a consolation prize. It was remarkable, in its own terms — and I could feel that for the first time because I was finally using the right measuring stick.", "Your sentence will sound like your life, not mine. But write it as if you're introducing the real, current version of you to someone you'd like her to meet — with the warmth you'd bring to introducing a friend you deeply admire.", "FADE OUT"]}, "type": "lesson", "_body": ["There's one more thing I want you to do before we close this course. It's the smallest thing on the list, and also the one that matters most.", "I want you to write the first line of a new story.", "Not a long one. Not a whole chapter. Just one sentence — the first sentence of a story that begins from today, not from the old picture. One sentence that is true, that is generous to who you actually are right now, and that would earn a 10 if you were measuring by your own standards instead of the old ones.", "Here's what mine sounded like, the first time I wrote it. It wasn't dramatic. It wasn't inspirational in the way things look on the wall of a wellness studio. It was just honest: I am a woman in my late forties, in a city that gives me room to breathe, doing work that is mission-aligned and meaningful, raising three children who are growing into themselves, writing a book that is finding its shape.", "That's it. No mention of the anchor chair. No mention of New York. No mention of the old photograph I'd been trying to match. Just the truth of the actual life, told kindly.", "When I read that sentence back to myself, something quiet shifted. The life it described was not a smaller version of the old one. It was not a consolation prize. It was genuinely, in its own terms, remarkable — and I could feel that for the first time because I was finally using the right measuring stick.", "Your sentence will sound like your life, not mine. But here's the instruction: write it as if you're introducing this person — this real, current, actual version of you — to someone you'd like her to meet. Write it with the same warmth and generosity you'd bring to introducing a friend you deeply admire.", "One New Line. Write the first sentence of your new story. Then write a second, if one comes. Then a third. Let the story begin from the ground you're actually standing on.", "Reflect: If you lived by the new story's standards for one week — measuring by today's joy, today's season, today's actual life — what might shift?"]}, {"id": "check-3", "title": "The New Story's First Three Lines", "objective": "", "video": null, "type": "capstone", "module": 3, "_body": ["Learning objective tested: Applying the full arc of the course — naming the old story, releasing it with intention, and beginning the new one from the ground of today's actual life.", "The capstone. Write the first three lines of your new story — one for career, one for health, one for family (or three areas of your own choosing). Each line should:", "Begin from today's standards, not the old picture's", "• Name something that is genuinely true about your actual life right now", "• Earn a 10 by the new measuring stick", "Then write one more line: the plain, honest answer to the question your hum was asking. Not the question you've been avoiding. The answer to it, as clearly as you can put it into words.", "A Closing Note", "If you've made it here — if you've sat with the blank paper, crossed off the transitory identities, found the wrong measuring stick, and written the first line of a new story — I want to tell you something: the hum was never a problem. It was a gift.", "It was the part of you that knew, even when you didn't have language for it, that you were measuring the wrong things. That the scoring system had gone stale.", "That the old story had served its purpose and something new was ready to be written.", "You don't owe the old story your loyalty. You don't owe the old version of yourself a life organized around her needs, her standards, her idea of what a 10 looks like. She got you here. You can thank her — I genuinely mean that — and let her go.", "The new story starts from today. It starts from the actual life, lived by the actual person you are, measured against standards that belong to this season instead of the last one.", "Start there. It's enough. It's more than enough. It might, in fact, be everything.", "xx Shibani"]}]}]}, {"title": "The Guilt Loop", "subtitle": ["A course on the feeling you're not supposed to have — and what to do with it", "A 7-lesson course built from the The Alignment Check, for the moment when you recognize that your life is good and you still, somehow, feel off — and immediately feel guilty for that, too."], "promise": ["By the end of this course, you will be able to:", "• Name the Guilt Loop — the cycle in which feeling dissatisfied leads immediately to feeling ashamed for feeling dissatisfied — and break the loop by understanding what it's actually made of", "• Separate the pain of inconvenience from the pain of genuine tragedy, using a simple, grounding filter that stops catastrophizing in its tracks", "• Distinguish between the voice that says \"you're ungrateful\" and the voice that says \"something here genuinely needs your attention\" — because both exist, and they are not the same voice", "• Use the hum underneath your guilt as information, rather than something to suppress, escape, or argue yourself out of", "This is not a course about practicing gratitude until the difficult feelings go away. It's a course about understanding why guilt makes the loop worse — and learning to meet the feeling underneath it with honesty instead."], "who": ["The person who has everything she always wanted and keeps apologizing to herself for feeling anything but grateful. The person who catches herself thinking \"is this it?\" and immediately punishes herself for the thought. The person who compares her life to people who have less and uses the comparison to confirm that she has no right to want anything different.", "The person who has spent so long managing her feelings by reminding herself of what she has, that she's lost track of what she actually feels.", "If you've ever silenced a real signal by covering it with guilt — this course is for you."], "startEnd": ["Start: You feel something that seems like it shouldn't be there — a low-grade \"is this it?\" or \"why isn't this enough?\" — and before you've even finished feeling it, you feel ashamed of yourself for feeling it. That shame silences the original feeling, which doesn't actually go away, so it comes back — and the loop begins again.", "End: You can feel the original signal without immediately triggering the guilt response. You have a clear filter for telling the difference between an inconvenience and a real signal. And you understand, in your body as much as your mind, that gratitude and dissatisfaction are not opposites — they can, and often do, exist in exactly the same person, at exactly the same time."], "resources": ["Every lesson in this course is built directly on Shibani's own published essays — most centrally \"Seeing Ourselves as More Than Our Jobs\" (the 2016 meditation retreat where Shibani sat with tears on her face and felt \"I didn't have the right to complain... I felt guilty for complaining because it could show that I was ungrateful\"), \"Why Complaining Hurts You\" Dr. Ellen Langer's tragedy-or-inconvenience framework), \"Learning How to Manage My Mind\" (the Cancel/Clear/Replace method, \"our thoughts are the vibrational soil from which our lives sprout\"), and \"Walking with Vulnerability\" (the moment of finally saying the true thing — \"I worried I can't do it all by myself\" — and the relief that followed). The Guilt Loop is the emotional architecture that keeps the original signal buried — and Shibani has written, publicly, about living inside it."], "modules": [{"num": 1, "title": "Name the Loop", "tagline": "Seeing the guilt-dissatisfaction cycle clearly enough to step back from it", "lessons": [{"id": "1.1", "title": "The Feeling You're Not Supposed to Have", "objective": "By the end of this lesson, you can name the Guilt Loop — the specific cycle in which dissatisfaction triggers shame, which suppresses the original signal, which then returns — and trace one recent instance of it in your own experience.", "video": {"title": "The Feeling You're Not Supposed to Have\" 90", "paragraphs": ["OPEN ON SHIBANI", "I want to describe a cycle I lived inside for years before I had a name for it.", "Something would feel off. Not dramatically. Just a quiet signal: is this it? Is this actually working for me? And before I'd even finished feeling it, a second thought would arrive: what is wrong with you? Look at everything you have. And so I'd push the feeling down. Remind myself to be grateful. Redirect to people who had less.", "For a while, it would work. Then it would come back. And the whole sequence would start again: signal, shame, suppression, return. Around and around.", "I was sitting in that loop at a meditation retreat in 2016. My life looked, from the outside, privileged, ideal, and happy. And precisely because of that, I felt I didn't have the right to complain. Worse — I felt guilty for complaining, because it could mean I was ungrateful.", "That guilt didn't resolve the original signal. It just buried it long enough for it to come back stronger.", "Here's what I've come to understand: the guilt is not the truth. It feels like a verdict — but it isn't. It's the old story running its default program. And underneath it is a real signal that deserves real attention — regardless of how much or how little you have relative to someone else.", "Someone else's harder life does not disqualify your signal. That's not how signals work.", "So here's your practice. Think of one recent moment when you felt something you immediately told yourself you shouldn't feel. Map the sequence: the original feeling, the guilt thought, what you did with it, whether it actually went away. Write it down as a loop — not a flaw.", "FADE OUT"]}, "type": "lesson", "_body": ["I want to describe a cycle I lived inside for years before I had a name for it.", "Something would feel off. Not dramatically — not a crisis, not a collapse. Just a low, persistent signal: is this it? Is this actually working for me? And before I'd even finished feeling it, a second thought would arrive right behind it: what is wrong with you? Look at everything you have. Other people have real problems. You don't have the right to feel this.", "And so I would push the original feeling down. Tell myself to be grateful, remind myself of what I had, redirect my attention toward the people who had less. And for a little while, it would work. The feeling would quiet.", "But it wouldn't stay quiet. It would come back — sometimes the same day, sometimes a week later, sometimes in a slightly different form. And then the whole sequence would begin again: the signal, the shame, the suppression, the return. Around and around.", "I was sitting in that loop at a meditation retreat in San Diego in 2016. The details of my life at the time — three young children, a career that had paused, a cross-country move, an identity that had dissolved faster than I'd expected it to — felt, to me, completely un-nameworthy. To an outsider, my life would have looked privileged, ideal, and happy. And precisely because of that, I felt I didn't have the right to complain. Worse yet, I felt guilty for complaining — because it could show that I was ungrateful.", "That guilt didn't resolve the original signal. It just buried it long enough for it to come back stronger.", "Here's what I've come to understand about the Guilt Loop: the guilt is not the truth. It feels like the truth — it arrives with the confidence of a verdict — but it is not. The guilt is the old story running its default program: you built this life, you chose this, you should be grateful. And underneath the guilt is a real signal that deserves real attention, regardless of how much or how little you have relative to someone else.", "Someone else's harder life does not disqualify your signal. That's not how signals work.", "So here is your practice this week.", "The Loop Trace. Think of one recent moment when you felt something you immediately told yourself you shouldn't feel. Map the sequence, as clearly as you can: What was the original feeling? What was the guilt thought that followed it? What did you do with the feeling as a result? Did the feeling go away — or did it come back?", "Writing it down as a sequence rather than a summary helps you see the loop as a loop — something with a structure, not just a character flaw.", "Reflect: What is the most common \"I don't have the right to feel this\" thought you have? How long have you been having it?"]}, {"id": "1.2", "title": "The Right to Complain", "objective": "By the end of this lesson, you can examine where \"I don't have the right to feel this\" comes from — whose voice it is, whose standard it enforces — and begin to question whether it's actually the right authority on your experience.", "video": {"title": "The Right to Complain\" 90", "paragraphs": ["OPEN ON SHIBANI", "\"I don't have the right to complain\" might be one of the most well-meaning and damaging sentences in the English language.", "Well-meaning — it comes from real impulses. Stay grateful. Don't be dramatic. Others have it harder. These are genuinely good impulses. I don't want to dismantle them.", "Damaging — because they get deployed not against actual complaining, but against the very first whisper of any feeling that doesn't match what the old story says you should feel. A pre-emptive silencer. Before you've even finished feeling the feeling — before you've even asked what it might be trying to tell

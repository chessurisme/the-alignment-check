a performance. Instead — it felt almost boring. Like describing the weather. And that boredom was the most remarkable part. Because true things don't need a performance to hold them up.", "So: do it once. Imperfectly. Out loud.", "You don't become brave and then act. You act — once, small, imperfect — and discover you were more ready than you thought.", "FADE OUT — END OF COURSE"]}, "type": "lesson", "_body": ["Here we are — the last lesson, and, in a strange way, the only one that actually counts.", "Everything up to now has happened on the page: noticing, naming, crossing off, drafting, choosing. All of it real, all of it necessary — and all of it, so far, completely private. Nothing has had to be brave yet. Nothing has had to risk anything.", "This lesson is where that changes. And I want to be honest with you: it is the smallest possible version of brave, and it will probably still make your stomach flutter a little. Good. That flutter means you're standing right at the edge of something that matters.", "You will never feel fully ready to say your new sentence out loud. I want to say that plainly, because I think a lot of us are quietly waiting for a feeling of readiness that simply does not arrive on schedule — sometimes it doesn't arrive at all. Waiting until it feels completely natural is just another way of letting the old sentence keep talking for you, indefinitely, by default.", "So here is what I'd like you to do instead. Not a grand announcement. Not a dramatic reveal at a dinner party, with everyone's eyes on you. Something small, almost throwaway — the kind of moment that, if it goes sideways, costs you almost nothing.", "The One-Time Say. This week, find one low-stakes moment — a casual \"what do you do?\" from someone you'll likely never see again, a journal entry read aloud, a voice memo to yourself in the car, an introduction on a call where nobody's really listening that closely anyway. And in that moment, instead of reaching for the old sentence — the one that starts with \"I used to…\" — reach for the new one. The one you wrote and chose in the last lesson. Say it. Out loud. Let it land in the air, where someone — even if that someone is only you — can actually hear it.", "Then notice what happens in your body right after. Not what the other person says back; that's almost beside the point. What happens in you. Does your chest tighten or loosen? Does it feel like a lie you're telling, or like a fact you're finally catching up to? Does it feel, even a little, like relief?", "I'll tell you what happened the first time I said something close to my own new sentence out loud, to someone who didn't already know my history. I braced for it to feel like a performance — like I was claiming something I hadn't yet earned. Instead, it felt almost unremarkable. Almost boring. Like describing the weather. And that boredom was, itself, the most remarkable thing about it — because it meant the sentence was simply true, and true things don't require a performance to hold them up.", "That's the whole secret hiding inside imperfect action: you don't do the brave thing because you've become brave. You do the small, slightly uncomfortable thing — once — and you discover, afterward, that you were more ready than you believed. The readiness was never the missing ingredient. The doing was.", "So: do it once. Just once, this week. Not perfectly. Not eloquently. Just once, out loud, where it can be heard.", "And then come back, and let's close this out together.", "Reflect: Write down exactly what you said, who you said it to, and what you noticed in your body in the seconds right after. Don't edit it to sound more profound than it was. The plain version is the one worth keeping."]}, {"id": "check-3", "title": "Writing Toward Next Year", "objective": "", "video": null, "type": "capstone", "module": 3, "_body": ["Learning objective tested: Applying the full arc of the course forward — projecting a future present-tense sentence, and identifying the smallest realistic step toward living inside it.", "Prompt. Write the present-tense sentence you would want to be able to say, honestly and without flinching, about yourself one year from today. Then answer: what is the smallest, most realistic version of that sentence you could begin practicing — even quietly, even just to yourself — this week?", "A way to think it through: There's no single correct answer here — but it's worth noticing whether the sentence you wrote for a year from now sounds like an extension of the honest, plain sentence you chose in Lesson 3.2, or whether it has quietly slipped back into old-judge language: impressive, comparative, borrowed. If it has, that's not a failure. It's simply more information — exactly the kind Lesson 1.2 taught you to gather without judgment.", "The whole practice of this course was never about arriving at one perfect sentence and being finished. It was about learning to notice when the sentence needs updating again — and trusting, by now, that you already know how to do that.", "Closing — Before You Go", "You started this course noticing a sentence. You're ending it having said a different one — out loud, where it could be heard.", "That's not a small thing, even though it might feel like one. Most people go years, sometimes whole decades, without ever updating the sentence they use to describe themselves to the world — let alone saying the new version out loud, on purpose, to another person.", "You will catch yourself slipping back into the old one. That's not a sign this didn't work. That's just what trenches do — they're worn deep, and old paths pull at your feet long after you've decided to walk a new one. The skill this course actually teaches isn't never say the old sentence again. It's notice faster, and choose again, sooner — every single time.", "So: notice. Name the judge. Cross off what can change. Write the plain sentence. Say it once. And when the old one shows up again — because it will — just begin again, gently, the way you'd help a friend up off the ground rather than scold them for falling.", "That's the whole practice. Not perfection. Just a faster return to the truth.", "xx"]}]}]}, {"title": "The Spark", "subtitle": ["A course on the small, almost embarrassing thought that shows up and won't leave: \"I can do more.\"", "A 7-lesson course built from the The Alignment Check, for the moment something inside you quietly announces that the life you've built is a floor, not a ceiling."], "promise": ["By the end of this course, you will be able to:", "• Recognize the Spark — the specific thought, feeling, or inner announcement that quietly insists I can do more, there's more, this isn't all of it — and understand it as information, not restlessness, ego, or ingratitude", "• Distinguish the Spark from the noise around it: from ambition that looks like the old story's checklist, from chronic dissatisfaction, from the midlife myth that wanting more means you're ungrateful for what you have", "• Trust that the Spark is not random — that it tends to arrive at a specific kind of moment, when you're closest to your genuine self, and that its timing is not incidental", "• Take one willing, imperfect, fifteen-minute step in the direction the Spark is pointing — before you've talked yourself into waiting for the right moment, the right credentials, the right sign", "This is not a course about ambition as achievement. It's a course about learning to hear a very specific signal — quiet, stubborn, slightly inconvenient — and choosing to take it seriously before it fades."], "who": ["The person who is doing fine — genuinely fine — and yet cannot shake the feeling that fine is not the whole story. The person who is sitting under the studio lights, or driving the kids to school, or finishing a perfectly solid week of work, and has a thought arrive that she wasn't entirely expecting: I can do more. The person who has already built something real and wonders if that makes the thought inappropriate. The person who has been quiet about the Spark because she doesn't quite know what to do with it yet, and worrying it might mean she's ungrateful for what she has.", "If you've ever had a thought that felt too big to say out loud — this is for you."], "startEnd": ["Start: You have a thought — spontaneous, unbidden, specific — that arrives when you least expect it: I can do more. And it lingers in a way that the usual daily thoughts don't. But you're not sure whether to trust it or dismiss it. It might be ego. It might be restlessness. It might be the old story dressed up in different clothing. You're not sure.", "End: You can hear the Spark clearly, trace where it came from, distinguish it from the noise around it, and take one willing step in the direction it's pointing — not when the path is clear, but right now, in the middle of everything, before the Spark goes quiet and the waiting begins again."], "resources": ["Every lesson in this course is built directly on Shibani's own published essays — most centrally \"On Making Career Shifts\" (the studio-lights moment: \"I can do more\"; the non-negotiables exercise; \"sometimes in order to go from A to Z, you have to move through letters L, M, N, O, and P\"), \"2025 The Year of Going Bigger\" (the Southwest road trip as an answered Spark; \"Don't play small. Step up. Do it, Shibani\"; \"What more can I do, if I just try?\"), \"What Are You Waiting For?\" (the midlife urgency as compass; the 15Minute Act; \"Redefine Ready — your new definition is simply willing\"), and \"Curiosity, Grit and Midwestern Spirit\" (the dean's story; \"the yearning for more is a universal story\"). The Spark is the moment before everything else begins — and these are the essays where Shibani has written about recognizing it, trusting it, and the first step after it arrives."], "modules": [{"num": 1, "title": "Hear It", "tagline": "Recognizing the Spark — the specific thought that arrives when you're closest to yourself", "lessons": [{"id": "1.1", "title": "Under the Lights", "objective": "By the end of this lesson, you can name the Spark — the specific inner announcement that says I can do more — and trace where and when you've felt it most clearly.", "video": {"title": "Under the Lights\" 90", "paragraphs": ["OPEN ON SHIBANI", "I was standing under the studio lights on day five of a client shoot.", "This is an ordinary moment in the life of a broadcast journalist turned executive coach: the heat of the set, the producer's earpiece, a guest being microphoned across the room. My hair was getting its final spray. Someone handed me gloss.", "And then, through the haze, with my eyes closed, a thought arrived.", "I didn't invite it. I wasn't journaling or on a retreat. I was standing in the middle of a perfectly ordinary, professional Wednesday. But the thought came anyway, the way the most important thoughts tend to: unbidden, specific, and slightly inconvenient.", "I can do more.", "No clarification, no roadmap. Just that. And it stayed — the way thoughts stay when they're not just thoughts but signals.", "The Spark is different from ambition. Ambition says: get more. The Spark says: you have more to give. And it tends to arrive at exactly this kind of moment — not when you're quiet and searching, but when you're in the middle of your actual life, doing something you're good at, close to the genuine version of yourself. It arrives in the ordinary, because that's where it finds you most clearly.", "So here's your practice. Think back over the past year. Not through your goals or your calendar — through your actual moments. Where did the thought arrive? The small, specific ones: I could do this better. There's more here. Write down three moments, however partial they feel.", "And then: what do they have in common? Is there a pattern to where the Spark finds you?", "FADE OUT"]}, "type": "lesson", "_body": ["I was standing under the studio lights on day five of a client shoot.", "This is an ordinary moment in the life of a broadcast journalist turned executive coach: the heat of the set, the producer's earpiece, a guest being microphoned across the room. I'd done this a thousand times. My hair was getting its final spray. Someone handed me gloss. The lights had that particular studio haze that I'd stopped noticing years ago.", "And then, through the haze, with my eyes closed, a thought arrived.", "I didn't invite it. I wasn't in a journaling moment, or on a retreat, or sitting quietly with my own questions. I was standing in the middle of a perfectly ordinary, professional Wednesday. But the thought came anyway, the way the most important thoughts tend to: unbidden, specific, and slightly inconvenient.", "I can do more.", "That's it. That's the whole thought. No clarification, no roadmap, no accompanying blueprint for what \"more\" would look like. Just that. And it arrived with a quietness that was somehow more insistent than anything loud could have been.", "I didn't say it out loud. I finished the shoot. I drove home, made dinner, got the kids to bed. But the thought stayed. It didn't fade the way the day's other thoughts faded — the to-do list items, the scheduling concerns, the things I'd meant to follow up on. It stayed, the way thoughts stay when they're not just thoughts but signals.", "The Spark is different from ambition. Ambition says: get more. The Spark says: you have more to give. Ambition is about acquisition. The Spark is about expansion — toward something that the life you've built has made you ready for. Ambition points at the scoreboard. The Spark points at the road ahead.", "And the Spark tends to arrive at exactly this kind of moment — not when you're quiet and searching for it, but when you're in the middle of your actual life, doing something you're good at, close to the genuine version of yourself. The studio lights. The drive to pick up the kids. The meeting where you suddenly see, with unexpected clarity, that you know more than you've been using. The Spark arrives in the ordinary, because that's where it finds you most clearly — when the performance has dropped away and what's left is just you.", "Here's your practice this week.", "Spark Map. Think back over the past year — not through your goals or your calendar or your achievements, but through your actual moments. Where did the thought arrive? Not the big ambition thoughts — the small specific ones: I could do this better. There's more here. I have something to say about this. Map the moments: where were you? What were you doing? What was the thought, as precisely as you can reconstruct it? Write down three moments, however small or partial they feel.", "Reflect: Looking at the three moments: what do they have in common? Is there a pattern to where and when the Spark arrives for you?"]}, {"id": "1.2", "title": "Not Ingratitude", "objective": "By the end of this lesson, you can hold the Spark and genuine gratitude at the same time — understanding that wanting more does not mean you're dissatisfied with what you have, and that the both/and is not a contradiction.", "video": {"title": "Not Ingratitude\" 90", "paragraphs": ["OPEN ON SHIBANI", "Here's the question I've heard more than almost any other, when women tell me about the Spark:", "But shouldn't I just be grateful for what I have?", "I understand this. I've asked it myself. I have three healthy children. I live in the Bay Area. I've had a career that has taken me places most people never see. By any measure, I have enough.", "And yet the thought arrived: I can do more.", "And I'll be honest about the flicker of guilt that followed: who am I to want more? Isn't this what ingratitude sounds like?", "No. It isn't.", "Ingratitude is not being able to see what you have because you're too busy wanting what you don't. The Spark is different: it is because you can see what you have that you can also see where it points. It's built on top of your life, not in rejection of it. The skills, the clarity, the resilience of everything you've survived and learned — that's what makes the Spark possible. It's not a rejection of that life. It's a recognition of what it's made you capable of.", "The Spark and gratitude can coexist. You don't have to choose between being grateful for the life you've built and hearing that there's more it wants to become.", "So here's your practice. Draw a line down the middle of a page. Left side: what you're genuinely grateful for. Right side: what the Spark is saying. Everything on the right should be in addition to, not instead of, what's on the left.", "Where does the both/and feel easy to hold? Where does it still feel like a contradiction?", "FADE OUT"]}, "type": "lesson", "_body": ["Here's the question I've heard more than almost any other, when women tell me about the Spark:", "But shouldn't I just be grateful for what I have?", "I understand this question. I've asked it myself. I have three healthy children. I live in the Bay Area. I've had a career that has taken me to places most people never see. I have, by any measure anyone external could apply, enough. More than enough. Considerably more than enough.", "And yet, standing under those studio lights, the thought arrived: I can do more.", "And I'll be honest about the flicker of guilt that followed it, before I let myself look at it clearly: who am I to want more? Isn't this what ingratitude sounds like?", "No. It isn't.", "The Spark is not ingratitude. Ingratitude is not being able to see what you have because you're too busy wanting what you don't. The Spark is different: it is because you can see what you have that you can also see where it points. It is built, not despite your life, but on top of it. The life you've built — the experiences, the skills, the clarity that came from everything you've survived and learned — is exactly what makes the Spark possible. The Spark is not a rejection of that life. It's a recognition of what it has made you capable of.", "As I headed into the year I called the year of \"going BIGGER,\" I wrote something that I keep coming back to: our time is precious. Our resilience is more than we know. Only by going bigger can we grow. That's not ingratitude. That's what becomes possible when you stop measuring yourself against the old story's checklist and start looking honestly at what you're actually equipped to do.", "The Spark and gratitude can coexist. They almost always do, for people paying attention. You don't have to choose between being deeply grateful for the life you've built and hearing, clearly, that there is more it wants to become.", "Here's your practice.", "The Both/And. On one page, draw a line down the middle. On the left side: write everything you're genuinely grateful for in your current life — not what you're supposed to be grateful for, but what actually lands as a gift when you think about it. On the right side: write what the Spark is saying. Every single thing on the right side should be in addition to, not instead of, what's on the left. The exercise is to let both columns be fully true at the same time.", "Reflect: Where does the both/and feel easy to hold? Where does it still feel like a contradiction?"]}, {"id": "check-1", "title": "Spotting the Spark", "objective": "", "video": null, "type": "checkin", "module": 1, "_body": ["Learning objective tested: Recognizing the Spark — and the guilt around it — in someone else's description of a feeling she's been dismissing.", "Scenario. A friend says: \"I feel weird saying this, but sometimes in the middle of a normal workday I have this thought like — there's something else I'm supposed to be doing. Not instead of this, just... in addition to it? But that seems greedy. I have a good job. I shouldn't be wanting more.\"", "Question. What would you say to her — specifically — about what she's describing?", "A way to think it through: She's describing the Spark precisely — the specific signal that arrives in the middle of the ordinary, the thought that says there's more here. And she's also describing the guilt that the Spark tends to bring with it. The most useful thing you could offer is the distinction between the Spark and ingratitude — that wanting more to give is not the same as being dissatisfied with what you have. That the thought she's having is not greedy; it's information. And the question isn't whether she should want it, but whether she's willing to take it seriously and see where it points."]}]}, {"num": 2, "title": "Trust It", "tagline": "Understanding the Spark as signal, not noise — and why its timing is not accidental", "lessons": [{"id": "2.1", "title": "The Yearning Is Universal", "objective": "By the end of this lesson, you can recognize the Spark not as an individual quirk or dysfunction, but as one iteration of a universal human story — the inner insistence that there is more to give — and trust it accordingly.", "video": {"title": "The Yearning Is Universal\" 90", "paragraphs": ["OPEN ON SHIBANI", "I was at a San Francisco alumni event for the University of Oklahoma — my alma mater, thirty or so of us, exchanging the warmth of people who share an origin that is exotic in this part of the country.", "Over the next hour, one story after another: a private equity professional who had grown up in the rough parts of Oklahoma City and still found his way to college, then Ivy League institutions, then a career in finance. A woman at a biotech company who had built a team from scratch.", "And then the visiting dean spoke.", "She'd grown up in small-town Oklahoma with no path to college. First generation. No counselor. She'd cared for her siblings. Shared the only car. And yet she'd held the dream. She went. Then her master's. Then her Ph.D. Her greatest accomplishment: every one of her siblings went to college too.", "I wrote afterward: the yearning for more is a universal story.", "Not generic — universal. It appears across lives that look almost nothing like each other. Different circumstances, different starting places, the same essential character: there is more, and I was made for it. The Spark doesn't belong to any particular kind of privilege or background. It belongs to human beings who are paying attention.", "So here's your practice. Think of three people — from your own life, or from stories you've heard — who heard a version of the Spark and followed it. Write what they heard, what they did, and what became possible. Look for the common thread.", "And then: what does it mean for how you hear your own Spark, that it belongs to this same story?", "FADE OUT"]}, "type": "lesson", "_body": ["I was at a San Francisco alumni event for the University of Oklahoma, my alma mater — the first Bay Area alumni gathering I was aware of in my five years of living here. A small group of us, thirty or so, in an elegant members-only club, exchanging the particular warmth of people who share an origin that is exotic in this part of the country.", "Over the next hour, one after another, people shared their stories of how they'd found their way from Oklahoma to San Francisco. A private equity professional who had moved through the rough parts of Oklahoma City, in and out of difficult circumstances, and still found his way to college, then Ivy League institutions, then a career in finance. A woman at a major biotech company who had built a team from scratch. Each story different. Each one carrying the same engine.", "And then the visiting college dean spoke.", "She had grown up in small-town Oklahoma with no paved path to college — first generation, no college counselor at her high school, no advanced education in her family. The eldest child in a large, struggling family. She'd cared for her siblings. She'd shared a car. She'd stayed nearby. And yet she had held the dream of going to college. She had gone. Then her master's. Then her Ph.D. — she became a scholar in mathematics education. Her greatest accomplishment: ensuring all of her siblings went to college too.", "I stood there and felt the same feeling I feel when I hear immigration stories — the particular recognition of something that is both specific and enormous. And what I wrote about it afterward was simple: the yearning for more is a universal story.", "Not universal in the sense of being generic. Universal in the sense that it appears across lives that look almost nothing like each other — across different levels of privilege, different kinds of access, different starting places — and always with the same essential character: there is more, and I was made for it. The Spark doesn't belong to any particular kind of life. It belongs to human beings who are paying attention.", "What that tells me, and what I want it to tell you: the Spark you're feeling is not the exception. It is the rule. It is one iteration of a story that has been told across every kind of life. It is not a private eccentricity. It is not restlessness or ego. It is the most ordinary thing about extraordinary people: they heard something calling and they took it seriously.", "Evidence Gather. Think of three people — from your own life, from public life, from stories you've read — who heard a version of the Spark and followed it. These don't have to be famous people. They can be people from your own family, your own community, people who did one thing quietly when they heard the call. Write down what they heard, what they did with it, and what became possible as a result. Look for the common thread.", "Reflect: What does it mean for how you hear your own Spark, that it belongs to this same universal story?"]}, {"id": "2.2", "title": "The Urgency That Is a Compass", "objective": "By the end of this lesson, you can understand the intensification of the Spark at midlife as information rather than crisis — and name, in one clear sentence, what the Spark is specifically pointing toward in your life right now.", "video": {"title": "The Urgency That Is a Compass\" 90", "paragraphs": ["OPEN ON SHIBANI", "Sometime around your late thirties or early forties, the Spark tends to change character.", "It doesn't get quieter. It gets more insistent. And it arrives with a companion feeling the culture has taught us to call a midlife crisis: the uncomfortable, growing urgency about the things that haven't happened yet. The things that feel important. The things that can no longer be safely deferred.", "But here's the reframe that has been one of the most useful things I've found: that urgency isn't a crisis. It's a compass.", "The midlife urgency is your soul's alarm clock, finally going off after you've hit snooze for a decade or two. It's the gut-level realization that the time you once saw as infinite now has a visible shoreline — and certain things are going to require you to stop waiting.", "The compass is the Spark, getting louder.", "As I headed toward a significant birthday, what I noticed was this: the things the compass was pointing toward weren't about the scoreboard. They were quieter, and more personal. The things I hadn't said. The work I hadn't started. The version of myself I hadn't yet been willing to fully step into.", "The Spark at midlife is urgency in service of clarity. Not hurry up — pay attention. It's showing you, with more precision than it could have twenty years ago, exactly where your energy belongs.", "So here's your practice. Complete this sentence, as specifically and honestly as you can: \"The Spark is pointing me toward...\" One sentence. Not a goal or a strategy — a direction. What is it saying to you, right now, when you let it speak?", "FADE OUT"]}, "type": "lesson", "_body": ["Sometime around your late thirties or early forties, the Spark tends to change character slightly.", "It doesn't get quieter. It gets more insistent. And it arrives with a companion feeling that the culture has taught us to call a midlife crisis — this uncomfortable, growing urgency about the things that haven't happened yet, the things that feel important, the things that can no longer be safely deferred.", "But I want to reframe that for you, because the reframe has been one of the most useful things I've found in midlife: that urgency isn't a crisis. It's a compass.", "The midlife urgency is your soul's alarm clock, finally going off after you've hit snooze for a decade or two. It is, if you listen to it honestly, the gut-level realization that the time you once saw as infinite now has a visible shoreline — and that certain things you've been waiting to do are going to require you to stop waiting. It's the universe handing you a compass and pointing, not toward what you should do, but toward what you must do.", "The compass is the Spark getting louder.", "I felt this arriving as I headed toward a significant birthday. And I'll tell you what I noticed: the things the compass was pointing toward weren't about achievement. They weren't about the scoreboard or the career milestone. They were quieter than that and more personal. They were about the things I hadn't yet said, the work I hadn't yet started, the version of myself I hadn't yet been willing to fully step into. They were the things that, if I were honest with myself, I had been quietly deferring since I left Fox Business ten years earlier.", "The Spark at midlife is urgency in service of clarity. It's not hurry up — it's pay attention. It's showing you, with more precision than it could have shown you twenty years ago, exactly what matters and what doesn't, exactly where your energy belongs and where it's been leaking. It's a navigation tool, not a symptom.", "Here's your practice.", "Compass Reading. Sit with the Spark as it exists in your life right now — not its full shape, just the direction it's pointing. Then complete this sentence as specifically and honestly as you can: \"The Spark is pointing me toward...\" Write it. One sentence. Not a goal or a strategy — a direction. What is it actually saying to you, right now, when you let it speak?", "Reflect: What has the urgency around this specific thing been costing you? What has deferring it looked like, in your actual daily life?"]}, {"id": "check-2", "title": "A Judgment Question", "objective": "", "video": null, "type": "checkin", "module": 2, "_body": ["Learning objective tested: Distinguishing between the Spark as compass and the Spark as crisis — understanding that trusting it doesn't mean dismantling everything.", "Question. Someone says: \"I think I have this feeling you're describing — but if I follow it, doesn't that mean I'm throwing away everything I've already built? I can't just start over.\" How would you respond?", "A way to think it through: The Spark is almost never about starting over. It's almost always about an addition, an expansion, or a deepening of what's already there. Shibani didn't leave Stanford to follow her Spark — she went back to work, and the Spark pointed her toward the additional work she hadn't yet started. The road trip wasn't instead of her life; it was added to her life as a demonstration of what was possible. Following the Spark looks less like dismantling and more like amplifying. The question isn't \"do I have to blow this up?\" — it's \"what would the Go Bigger version of what I'm already doing look like?\" That's a very different question, and it usually has an answer that doesn't require destroying anything."]}]}, {"num": 3, "title": "Follow It", "tagline": "The willing, imperfect first step in the direction the Spark is pointing", "lessons": [{"id": "3.1", "title": "What \"Going Bigger\" Actually Looks Like", "objective": "By the end of this lesson, you can articulate the \"Go Bigger\" version of one thing you're already doing — the amplified version that the Spark is asking for — and write it down concretely.", "video": {"title": "What Going Bigger Actually Looks Like\" 90", "paragraphs": ["OPEN ON SHIBANI", "The year after the studio-lights Spark arrived, I called my intention \"going BIGGER.\"", "I want to be precise about what I mean. Not bigger in the productivity-culture sense. Not more output or a more impressive headline. Something more personal: choosing to lean into the version of something that scares me a little, rather than the comfortable version I've already mastered.", "The example I used was a road trip.", "I was invited to a four-state Southwest adventure over the holidays. I'm a city person. Nice hotels. Skyscrapers. Long drives through the desert with kids? Not me. I'd long decided this was one of the things I'd given up as a single parent.", "Don't play small. Step up. Do it, Shibani.", "I went. And somewhere in those red sand desert views, I discovered something I hadn't expected: I could do it. And doing it changed what I believed myself capable of. I wrote afterward: \"What more can I do, if I just try?\"", "That's Going Bigger. Not a reinvention. A braver step from where you're already standing. The Spark isn't asking you to become a completely different person. It's asking you to stop hiding behind the comfortable version of who you already are.", "So here's your practice. Think of one thing you're already doing. Now write the Go Bigger version: not the five-year plan, not the full transformation — the one amplified step that's one braver move from exactly where you are.", "Write it as specifically as you can: what would you do, when, and with whom?", "FADE OUT"]}, "type": "lesson", "_body": ["The year after the studio-lights Spark arrived, I called my intention \"going BIGGER.\"", "I want to be precise about what I meant by that — because I don't mean bigger in the way that word usually functions in productivity culture. I don't mean more output, a more impressive LinkedIn headline, or a more aggressive set of targets. I mean something more specific and more personal: choosing to lean into the version of something that scares me a little, rather than the comfortable version I've already mastered.", "The example I used was a road trip.", "I was invited to join my sister's family on a four-state Southwest road trip over the holiday break. As a skyscraper-loving, nice-hotel, city-person, the idea of a long drive through the desert with kids felt foreign at best and uncomfortable at worst. I am not a nature person. I am not a road trip person. I had long decided that road trips were one of the things I'd given up as a single parent — that I wouldn't feel comfortable doing it solo.", "Don't play small. Step up. Do it, Shibani.", "I went.", "And somewhere in the twist and turns through the red sand desert, with my kids and their cousins in the back seat, with views that I'm still not sure I have words for — I discovered something I hadn't expected. I could do it. And doing it changed something about what I believed myself capable of. I wrote afterward: \"What more can I do, if I just try?\"", "That's what Going Bigger looks like. It's not a reinvention. It's a braver step from where you're already standing.", "The Spark isn't usually asking you to become a completely different person. It's asking you to stop hiding behind the comfortable version of who you already are. To take the one step that scares you slightly, from the place where you actually stand.", "For someone looking to write a book: not \"someday I'll write a book\" — \"I'll join a writing group and commit to one session a week.\" For someone wanting a career change: not \"I'll think about this more\" — \"I'll set up three networking conversations this month.\" Not the full transformation, not the five-year plan. The one amplified step, taken from exactly where you are.", "Go Bigger Draft. Think of one thing you're already doing — something real, not theoretical. Now write the Go Bigger version: not the reinvented version, not the version that requires everything to be different first, but the version that is one brave step more than what you're doing now. Write it as specifically as you can: what would you do, when, and with whom?", "Reflect: What has been making you wait for the full version rather than taking the amplified step from here?"]}, {"id": "3.2", "title": "Redefining Ready", "objective": "By the end of this lesson, you can apply the ready → willing substitution — understanding that readiness is a myth that keeps the Spark waiting indefinitely, and that willingness is the only prerequisite for the first step.", "video": {"title": "Redefining Ready\" 90", "paragraphs": ["OPEN ON SHIBANI", "Here's the most common thing I hear when someone has felt the Spark clearly and not yet moved toward it:", "I'm not ready yet.", "Waiting for the kids to get older. For the promotion to come through. For savings to hit a certain number. Waiting for the traffic of life's obligations to magically part.", "I want to tell you something plainly: the lane does not magically part. The perfect moment does not arrive. And every week you spend waiting for readiness is a week the Spark waits alongside you, slightly quieter than before.", "You will never be 100% ready. The finances will never be perfect. You'll never have all the knowledge. \"Ready\" is a myth that keeps us standing still, engine idling, convinced the perfect moment is coming. Any minute now.", "But what if it isn't?", "What I've learned — through my own career shifts, through the long middle between leaving Fox and finding Stanford, through the road trip that went from \"I could never\" to \"what more can I do if I just try?\" — is that readiness is not what opens the door.", "Willingness is.", "Your new definition of ready: simply willing. Willing to try, to be clumsy, to learn as you go. The moment you are willing is the moment you are ready. Not when the path is clear, not when you're certain. When you're willing to take one step into the uncertainty.", "That moment is not someday. It's available right now.", "So here's your practice. Make a list of what you've been waiting to do until you felt ready — around the direction the Spark is pointing. Next to each: Am I willing to take one step, even without being ready? If yes — what is that step?", "FADE OUT"]}, "type": "lesson", "_body": ["Here is the most common thing I hear when I talk with people who have felt the Spark clearly and not yet moved toward it:", "I'm not ready yet.", "Waiting for the kids to get a little older. Waiting for the promotion to come through. Waiting for savings to hit a certain number. Waiting for a sign, for permission, for the endless snarled traffic of life's obligations to magically part, revealing a wide-open lane just for you.", "I want to tell you something plainly: the lane does not magically part. The perfect moment does not arrive. And every week you spend waiting for readiness is a week in which the Spark waits alongside you, quieter than it was the week before.", "You will never be 100% ready.", "This is not a motivational sentiment — it's a structural truth. The finances will never be perfect. You will never have all the knowledge. The circumstances will never be entirely aligned. \"Ready\" is a myth that keeps us standing still, engine idling, convinced that the perfect moment to begin is coming. Any minute now.", "But what if it isn't?", "What I've learned — through my own career shifts, through the long middle stretch between leaving Fox and finding my way to Stanford, through the road trip that went from \"I could never\" to \"what more can I do if I just try?\" — is that readiness is not what opens the door. Willingness is.", "Your new definition of ready: simply willing. Willing to try, willing to be clumsy, willing to learn as you go, willing to be courageous. The moment you are willing is the moment you are ready. Not the moment you have all the answers, not the moment the path is clear, not the moment you feel certain. The moment you are willing to take one step into the uncertainty.", "That moment is not someday. That moment is available right now.", "Willing Check. Make a list of the things you've been waiting to do until you felt ready — specifically, around the direction the Spark is pointing. Then next to each item, write: Am I willing to take one step toward this, even without being ready? If the answer is yes — what is that step?", "Reflect: What has waiting for readiness cost you, specifically, around this particular thing?"]}, {"id": "3.3", "title": "The Fifteen-Minute Act", "objective": "By the end of this lesson, you can identify one specific fifteen-minute act toward the direction the Spark is pointing, and commit to taking it before the lesson ends.", "video": {"title": "The Fifteen-Minute Act\" 90", "paragraphs": ["OPEN ON SHIBANI", "I'm going to make this one simple.", "You don't need a five-year plan. You don't need a fully formed vision. You don't need to know where the path leads before you start walking it.", "You need fifteen minutes.", "The path doesn't reveal itself from the outside. It is created by walking it. And you cannot see the shape of the whole thing from where you're standing — no one can. What you can see is the next step. And the next step only requires fifteen minutes.", "Don't write a book. Open a document and write one paragraph.", "Don't start a business. Spend fifteen minutes researching one competitor.", "Don't redesign your entire life. Tell one person what the Spark is saying.", "The fifteen-minute act is not a shortcut. It's a philosophy about how change actually works: not in grand gestures, but in repeated small acts of willingness over time. Each one is the path revealing one more inch. Each one is the Spark being honored, in real time, in the middle of your actual life.", "What I discovered on that road trip — what unlocked the question \"What more can I do, if I just try?\" — was not that I had prepared extensively. It was that I'd said yes when I could have said no. I was willing before I was ready. The Spark said go, and I went, and the going taught me it was possible.", "So here's your practice. Name the specific fifteen-minute act you will take this week. Be concrete: not \"I'll work on my book\" — \"I'll open the document and write two hundred words before dinner on Tuesday.\" Name the act, the day, and the time. Write it down.", "And then do it. The Spark has been waiting long enough.", "FADE OUT"]}, "type": "lesson", "_body": ["I'm going to make this one simple.", "You don't need a five-year plan. You don't need a fully formed vision. You don't need to have figured out where the path leads before you're willing to start walking it.", "You need fifteen minutes.", "Here's how I've learned to think about this: the path doesn't reveal itself from the outside. It is created by walking it. You cannot see the shape of the whole thing from where you're standing — no one can. What you can see is the next step. And the next step only requires fifteen minutes, not certainty.", "Don't write a book. Open a document and write one paragraph.", "Don't start a business. Spend fifteen minutes researching one competitor.", "Don't make a major career shift. Set up one informational interview.", "Don't redesign your entire life. Tell one person what the Spark is saying.", "The fifteen-minute act is not a shortcut and it's not a hack. It's a philosophy about how change actually works: not in grand gestures, but in repeated small acts of willingness, over time. Each fifteen-minute act is the path revealing one more inch of itself. Each one makes the next one slightly more visible. Each one is the Spark being honored, in real time, in the middle of your actual life.", "The thing I discovered on that road trip — the thing that unlocked the question \"What more can I do, if I just try?\" — was not that I had prepared extensively for it. It was that I had said yes when I could have said no. I had been willing, even before I was ready. The Spark said go , and I went, and the going was what taught me that it was possible.", "Your turn.", "The Fifteen Minutes. Name the specific fifteen-minute act you will take this week toward the direction the Spark is pointing. Be as concrete as possible: not \"I'll work on my book\" — \"I'll open the document and write two hundred words before dinner on Tuesday.\" Not \"I'll think about the career shift\" — \"I'll email one person from my network on Wednesday morning and ask for a fifteen-minute call.\" Name the act, the day, and the time. Write it down.", "And then: do it. Not when everything is aligned. Not when the path is clear. This week. The Spark has been waiting long enough.", "Reflect: What would it mean — not to have arrived anywhere — but simply to have started?"]}, {"id": "check-3", "title": "The Thought You Haven't Said Out Loud", "objective": "", "video": null, "type": "capstone", "module": 3, "_body": ["Learning objective tested: Applying the full arc of the course — naming the Spark clearly, trusting it as signal rather than noise, and committing to the first willing step.", "The capstone. Name the thought you haven't said out loud yet — the one that starts with \"I can\" or \"I want to\" or \"there's something I'm supposed to be doing.\" Be as specific as you can.", "Then:", "1. Write it out plainly — the thought, in your own words, without softening it 2. Name what has been making you wait (the readiness myth, the ingratitude concern, the comparison spiral, the fear that the path isn't clear) 3. Name your fifteen-minute act — the one you will take this week, before the Spark goes quiet again", "Write all three. Then take step three.", "A Closing Note", "The Spark is not random. It is not restlessness. It is not ego or ingratitude or the inability to be satisfied with a good life.", "It is information. It is arriving from somewhere that knows you better than your calendar does, better than your to-do list does, better than the version of you that is very good at waiting for the right moment.", "It has been telling you something. You heard it. You've been carrying it.", "The path forward doesn't require clarity about the destination. It requires the fifteen minutes. It requires the willingness — which, I'll remind you, is the only form of readiness that was ever actually available.", "What more can you do, if you just try?", "xx Shibani"]}]}]}, {"title": "The Messy Middle", "subtitle": ["A course on the unglamorous stretch between deciding to change and actually changing", "A 7-lesson course built from the The Alignment Check, for the stretch that doesn't look like progress but is actually the whole work."], "promise": ["By the end of this course, you will be able to:", "• Recognize the Messy Middle — the stretch between the decision to change and the arrival at something new — and name it as a necessary phase of the journey rather than evidence that you're failing or have chosen wrong", "• Understand why the Messy Middle tends to look nothing like what you imagined change would look like, and why that gap is not an indictment", "• Navigate the middle with specific, practical tools: the non-negotiables list that clarifies your direction, the vulnerability of asking for help, and the mental garden practice that keeps you tending what you're growing even when it doesn't look like anything yet", "• Trust that sometimes in order to go from A to Z, you have to move through L, M, N, O, and P — and that the middle letters are not detours, they are the path", "This is not a course about making the Messy Middle clean or efficient. It's a course about staying in it long enough to come through."], "who": ["The person who decided. She did the hard thing of deciding. She left the job, or started the project, or chose the new direction — and now she's in the stretch that she didn't see coming: unglamorous, uncertain, slower than she expected, and completely lacking in the clear signposts she was promised would arrive after the decision was made. The person who woke up one morning in the middle of the change and thought: is this right? Not because the decision was wrong, but because the middle looks nothing like what she imagined. The person who is still going, still building, still doing — but doing it through the murk.", "If you have ever been disappointed by what change actually looks like up close — this is for you."], "startEnd": ["Start: You are in the middle of something. You decided. You began. And now you're here — in the stretch that has no clear milestones, no external validation, no guarantee that the thing you're building is actually working. It looks unglamorous and it is. Some days you're not sure whether to keep going or cut your losses and decide you were wrong.", "End: You can name what the Messy Middle actually is — not a failure of vision or courage, but the evidence that you're building something real. You have tools for moving through it: clarity on what you're not willing to compromise, the ability to ask for help before you've exhausted every other option, and a practice for tending your mental garden even when the ground looks bare. And you can trust, with evidence, that the L, M, N, O, P are how you get to Z."], "resources": ["Every lesson in this course is built directly on Shibani's own published essays — most centrally \"On Making Career Shifts\" (the long, unglamorous middle: career coach, non-negotiables list, informational interviews, the summer of reflection, the \"sometimes in order to go from A to Z you have to move through L, M, N, O, and", "P\"), \"Walking with Vulnerability\" (the ski trip; \"I worried I can't do it all by myself\"; asking for help as the thing that unlocked connection and solution), \"Learning How to Manage My Mind\" (the garden/leaky faucet metaphor; \"our thoughts are the vibrational soil from which our lives sprout\"; the daily practice of tending thought), and \"Getting Good at Endings\" (\"fear is like a veil — thin and permeable\"; \"practice dying before dying\"; \"for a new reality to come alive, we must end something first\"). The Messy Middle is the state where most people quietly give up — and these are the essays where Shibani has written about staying in it."], "modules": [{"num": 1, "title": "Name It", "tagline": "Recognizing the Messy Middle — what it actually looks like, and why it's different from what you expected", "lessons": [{"id": "1.1", "title": "This Is What Change Looks Like", "objective": "By the end of this lesson, you can name the Messy Middle — the specific stretch between deciding to change and arriving somewhere new — and map where you actually are in it right now.", "video": {"title": "This Is What Change Looks Like\" 90", "paragraphs": ["OPEN ON SHIBANI", "I want to tell you what I thought leaving Fox Business would look like.", "I thought I would step away from the studio, arrive in California, and find the next chapter waiting — obvious, organized, relatively swift. I had the credentials. I had the contacts. I had done the hard thing. The new version would emerge.", "What actually happened:", "I launched a blog months before my third child was born. I took a temporary anchor position in New York, relocating the whole family just to keep my resume from gapping. I built a freelance business while also being room parent and at pickup. I worked constantly. I succeeded, on any given day, at one thing or the other — career or motherhood — rarely both.", "I was not unhappy. But I was unquestionably in the middle. And the middle looked nothing like what I imagined change would look like.", "Here is the gap no one tells you about before you decide: the deciding is clean, and the arriving is rewarding, but the stretch in between — long, unglamorous, devoid of the signposts you were expecting — is what change actually looks like up close.", "This is the Messy Middle. And it is not a sign that you chose wrong.", "So here's your practice. Where are you in the middle right now? Answer honestly, not aspirationally. What does it actually look like today — the parts that are unglamorous, slower than expected, not what you imagined when you decided? Write it down, plainly. Not what you hope it will look like. What it is.", "FADE OUT"]}, "type": "lesson", "_body": ["I want to tell you what I thought leaving Fox Business would look like.", "I thought I would step away from the studio, arrive in California, and find the next chapter waiting — obvious, organized, relatively swift. I had the credentials. I had the contacts. I had done the thing (leaving) that was supposed to open the door. I would take some time to be with my family, and then the new version of my career would emerge.", "What actually happened:", "I launched a blog months before my third child was born. I took a temporary anchor position in New York — relocating the whole family for the summer just to keep the resume from gapping too wide. I built a freelance business, working with brands and broadcasters while also being room parent and at pickup. I worked constantly. I succeeded, on any given day, at one thing or the other — career or motherhood — rarely both. I was not unhappy. But I was unquestionably in the middle.", "And the middle looked nothing like what I had imagined change would look like.", "I think this is the gap that no one tells you about before you decide to change something: the deciding is clean, and the arriving is rewarding, but the stretch in between — the middle — is long, unglamorous, and almost completely devoid of the signposts you were expecting. You make the decision and you expect a relatively clean path from here to there. Instead you find yourself in the murk, doing the actual work of change, which looks less like a transformation and more like a series of difficult ordinary days.", "This is the Messy Middle. And it is not a sign that you chose wrong. It is simply what change looks like up close.", "The Messy Middle has a texture. It feels like: working without certainty of outcome. Doing things that don't quite fit the vision, because they're what's available right now. Going from A to Z and finding yourself at N — doing things you never expected to do, talking to people you never expected to need, trying things that don't pan out the way you thought they would. It feels like forward motion that doesn't look like progress.", "Here is your practice.", "Reality Inventory. Where are you in the middle right now? Don't answer aspirationally — answer honestly. What letter are you at, in the journey from A to Z? What does the middle currently look like, in a way you might not have admitted to yourself yet: the parts that are unglamorous, the parts that are slower than you expected, the parts that don't look like what you imagined when you decided? Write it down, plainly. Not what it will look like when you arrive — what it actually looks like today.", "Reflect: If you had known this was what the middle would look like, would you still have decided the same way?"]}, {"id": "1.2", "title": "The Middle Isn't Proof You Were Wrong", "objective": "By the end of this lesson, you can distinguish between \"this is hard because I chose wrong\" and \"this is hard because change is hard\" — and build an evidence case for what has actually shifted in the middle, even when it's not visible.", "video": {"title": "The Middle Isn't Proof You Were Wrong\" 90", "paragraphs": ["OPEN ON SHIBANI", "The cruelest trick the Messy Middle plays is making its difficulty feel like a verdict.", "When the middle is hard, it's easy to hear the hardness as an answer to a question you weren't quite asking: did I choose right? And the hardness seems to answer: maybe not. Maybe if the path were right, the signposts would be clearer.", "This is the Messy Middle speaking as verdict. And it is almost always wrong.", "In my own messy middle — the years between leaving Fox and finding my way to Stanford — I kept working. I built a business from scratch. I showed up for my kids. I wrote. I stayed in the market. None of it looked impressive or clean or like the story I'd imagined I'd tell. But all of it was real work, real building.", "Genuine change always requires a genuine middle. The fact that yours is unglamorous and uncertain and slow is not evidence that the path is wrong. It's evidence that you're doing the actual work of going from who you were to who you're becoming.", "If there were no middle, it would mean nothing was actually changing — just rearranging on the surface.", "So here's your practice. Go back through the middle you've been in. Write down everything that has actually changed, moved, or been built during it — even the things that didn't pan out, because those count too. What did you learn? Who did you become, slightly, that you weren't before you started?", "Is this the record of someone who chose wrong — or someone who is doing the actual work?", "FADE OUT"]}, "type": "lesson", "_body": ["The cruelest trick the Messy Middle plays is making its difficulty feel like a verdict.", "When the middle is hard — when the daily reality of change is unglamorous and slow and full of things you didn't plan for — it's very easy to hear the hardness as an answer to a question you weren't quite asking: did I choose right? And the hardness says: maybe not. Maybe if you had chosen correctly, it would be smoother. Maybe if the path were right, the signposts would be clearer. Maybe the murk you're in is proof of an error, not the inevitable texture of any real transition.", "This is the Messy Middle speaking as verdict. And it is almost always wrong.", "Here's the evidence I want you to look at: in my own messy middle — the years between leaving Fox and finding my way to Stanford — I kept working. I built a business from scratch. I showed up for my kids. I maintained relationships that mattered. I wrote. I stayed in the market. None of it looked impressive or clean or like the story I had imagined I would be able to tell. But all of it was real work, real growth, real building.", "I had made a choice and I was living inside the consequences of it — not the final consequences, the intermediate consequences, the ones that always look like nothing until you're far enough away to see that they were the whole preparation. The middle wasn't proof that I'd chosen wrong. It was proof that the thing I was building was real enough to require actual work.", "Genuine change always requires a genuine middle. The fact that your middle is unglamorous and uncertain and slow is not evidence that the path is wrong. It is evidence that you're doing the actual work of going from who you were to who you're becoming. If there were no middle, it would mean nothing was actually changing — just rearranging on the surface.", "Here is your practice.", "Evidence Check. Go back through the middle you've been in — however long, however murky. Write down everything that has actually changed, moved, shifted, or been built during it — even the things that didn't pan out, because those count too. What did you learn? What did you try? Who did you become, slightly, that you weren't before you started? Write it all down. Do not edit for impressiveness. This is not for anyone else's consumption. It's evidence for you.", "Reflect: Looking at the evidence check: is this the record of someone who chose wrong, or of someone who is doing the actual work of change?"]}, {"id": "check-1", "title": "Recognizing the Messy Middle", "objective": "", "video": null, "type": "checkin", "module": 1, "_body": ["Learning objective tested: Recognizing the Messy Middle — and the \"verdict\" confusion — in someone else's description of her experience.", "Scenario. A friend says: \"I finally left that job six months ago. And I know I made the right choice — or I thought I did. But honestly? It doesn't feel like I imagined. I'm working harder than ever, I'm not sure where it's going, and sometimes I wonder if the whole thing was a mistake. Shouldn't it feel better than this by now?\"", "Question. How would you explain to her the difference between \"this is hard because I chose wrong\" and \"this is hard because this is what the middle looks like\"? And what's one question you'd ask her to help her build her own evidence?", "A way to think it through: The \"shouldn't it feel better by now?\" is the middle speaking as verdict. The actual question to ask is: what has been built in six months? Not what has arrived fully formed — what exists that didn't exist six months ago? That question almost always reveals that significant work has happened that doesn't look like arrival yet. The middle isn't measured by how it feels at the time; it's measured by what it's producing. The feelings of uncertainty and hard work are not the result of a wrong choice. They're the texture of any real transition."]}]}, {"num": 2, "title": "Move Through It", "tagline": "Specific tools for navigating the stretch: clarity, vulnerability, and the mental garden", "lessons": [{"id": "2.1", "title": "The Non-Negotiables", "objective": "By the end of this lesson, you can write your own non-negotiables list — the specific, practical clarity that tells you whether an opportunity, direction, or next step is actually aligned with where you're going.", "video": {"title": "The Non-Negotiables\" 90", "paragraphs": ["OPEN ON SHIBANI", "In the middle of my own career transition, one of the most useful pieces of advice I received was this: figure out your non-negotiables for work first.", "My career coach offered this before I looked at a single job listing. Before I did a single informational interview. Figure out your non-negotiables. Write them down. And with those in hand, you'll know quickly whether something is a fit.", "What are they? The things you're not willing to give up — the conditions you need in order to show up as yourself. For me: keeping my side projects, commuting distance, permission to appear on stages. For you, they might be flexibility around pickup, working from home two days a week, a team environment rather than solo, mission alignment. Whatever they are — they're not a wish list. A wish list is aspirational. The non-negotiables list is a filter. These are the things that, if not present, will make you slowly miserable no matter how impressive the opportunity looks.", "Here's what this does for the Messy Middle: it gives you a compass in a phase that otherwise has very few. When you're at L, M, or N — doing informational interviews, exploring paths, trying to find the way by walking it — the non-negotiables tell you which paths are worth walking.", "So here's your practice. Write your own list for the specific change you're navigating. At least five things. And for each one: I know this because... Fill in the evidence from your own experience.", "What does the filter tell you about what you've been considering?", "FADE OUT"]}, "type": "lesson", "_body": ["In the middle of my own career transition, one of the most useful pieces of advice I received was this:", "Figure out your non-negotiables for work first.", "My career coach offered this early in my exploration — before I looked at job listings, before I did informational interviews, before I started trying to figure out what the next chapter would look like. Figure out your non-negotiables. Write them down. And with those in hand, you'll know quickly whether something is a fit.", "What are the non-negotiables? They're the things you're not willing to give up, the conditions you need in order to show up as yourself in whatever you're walking into. For me, they included things like: willingness to keep my side projects going, commuting distance, permission to appear on stages. For someone else they might be flexibility around school pickup, or the ability to work from home two days a week, or a team environment rather than a solo role, or a mission that feels aligned rather than just compensating.", "The non-negotiables list is not a wish list. A wish list is aspirational — you'd love it if you could have these things. The non-negotiables list is a filter. These are the things that, if not present, will make you slowly miserable no matter how impressive the opportunity sounds. They're often things you've learned the hard way, from roles or situations that didn't have them, and so they carry the weight of lived experience rather than preference.", "Here's what the non-negotiables list does for the Messy Middle: it gives you a compass in a phase that otherwise has very few. When you're at L, M, or N — when you're doing informational interviews, exploring things that may or may not pan out, trying to find the path by walking it — the non-negotiables list tells you which paths are worth walking and which ones are taking you in a direction you'd regret. It's a decision-making tool that works because it was built from self-knowledge rather than external expectations.", "In my career middle, it shortened conversations that would have taken months. I knew within a first meeting whether something was aligned or not, because I had already done the inner work of knowing what was non-negotiable. That's a gift you give yourself before you need it.", "Non-Negotiables List. Write your own. For the specific transition or change you're in the middle of right now: what are the things you are not willing to compromise? Be as specific as you can, and be honest — not about what you think you should be willing to compromise, but about what the evidence of your own history tells you actually matters. Write at least five things. Then, for each one, write: I know this because...", "Reflect: Looking at your non-negotiables: are there any opportunities or paths in the middle that you've been considering that fail the filter? And have you been honest with yourself about that?"]}, {"id": "2.2", "title": "Walking with Vulnerability", "objective": "By the end of this lesson, you can name the place in the middle where asking for help would open something that's currently stuck — and understand that saying I can't do this alone is not a confession of weakness but the single tool that most reliably creates new possibility.", "video": {"title": "Walking with Vulnerability\" 90", "paragraphs": ["OPEN ON SHIBANI", "It was days before Christmas. A ski trip was coming. Three kids, a six-plus-hour drive, not enough hands.", "I had a dozen reasons to cancel. The logistics were too complicated. And I was leaning into my default: when things get hard, manage it alone.", "My friend said: just call her. Tell her the truth.", "So I did. I said: I really want to go. But it's so busy right now. I'm worried about managing the kids alone on the slopes. Then I took a breath and added, quietly:", "\"I worried I can't do it all by myself.\"", "The relief of saying that sentence was immediate — before I even heard the reply. Just the act of saying the true thing, the thing underneath the logistics, released something.", "And then my friend said: we have three kids too. We'll help. We can drive together, ski together. We'll make it work — together.", "In meeting my vulnerability, she more clearly saw my challenges. From there, we created a solution from a more aligned place. That couldn't have happened had I hidden the truth.", "In the Messy Middle, we try to manage the complexity alone. I understand why. But the act of saying I can't do this alone doesn't add weight. It redistributes it. It creates access to solutions the middle had been keeping just out of reach.", "So here's your practice. Name one place in your middle where you've been managing alone something that would open if you asked for help. What's the stuck place? Who could you call? What's the thing underneath the facts — the sentence that starts not with the logistics but with the actual truth?", "FADE OUT"]}, "type": "lesson", "_body": ["It was days before Christmas. A ski trip was coming. I had three kids, a six-plus-hour drive, and not enough hands.", "I had already figured out a dozen reasons to cancel. The logistics were too complicated. The timing was terrible. The whole thing was ambitious in a way that felt irresponsible given the circumstances. And I was leaning into my default, which is: when things get too complicated, manage it alone.", "My friend told me: just call her. Tell her the truth.", "I'd been managing on my own for long enough that I'd stopped noticing that I was doing it. I was used to figuring out the solutions before anyone saw that there was a problem. I would hedge, or cover the stress, or make excuses that were mostly truthful — because asking for help felt like the thing I'd given up when my life became mine alone to manage.", "But on this particular day, I did it differently. I called the host of the ski trip. I said: look, I really want to go. But it's so busy right now. I'm worried about driving and managing the kids alone on the slopes. The facts were all there — but the facts weren't the issue. So I took a breath and added, quietly:", "\"I worried I can't do it all by myself.\"", "The relief of saying that sentence was immediate. The actual relief — the air escaping the balloon — came in the thirty seconds after I said it, before I even heard the reply. Just the act of saying the true thing, the thing underneath the logistics, released something.", "And then my friend jumped in and said: we have three kids too. We know what it is. We'll help you. We can drive together. We'll ski together. We'll make it work — together.", "In meeting my vulnerability, she more clearly saw my challenges. From there, we were able to create a solution from a more aligned place. It was something that could not have happened had I hidden the truth.", "In the Messy Middle, we tend to try to manage the complexity alone. This is understandable — the middle is already hard, and asking for help means admitting how hard it is, and that admission feels like adding one more heavy thing to carry. But what I've learned is almost the opposite: the act of saying I can't do this alone doesn't add weight. It redistributes it. It creates access to resources, solutions, and connection that the middle had been keeping just out of reach.", "Vulnerability Inventory. Name one place in the middle you're currently in where you've been trying to manage alone something that would open if you asked for help. Be specific: what's the stuck place, and what kind of help would actually make a difference? Then ask: who could I call? What would I actually say — not the facts, but the thing underneath the facts?", "Reflect: What has the \"manage it alone\" strategy been costing you in this particular stretch?"]}, {"id": "check-2", "title": "A Judgment Question", "objective": "", "video": null, "type": "checkin", "module": 2, "_body": ["Learning objective tested: Distinguishing between asking for help as a sign of weakness versus asking for help as the tool that unlocks the middle.", "Question. Someone says: \"I feel like I should be able to handle the middle on my own. If I need help this much, maybe I'm not as capable as I thought.\" How would you respond?", "A way to think it through: This is the exact misread the middle tends to create: interpreting the need for help as evidence of insufficient capability. But the evidence actually runs the other direction. The people who navigate the middle most effectively are almost never the people who go it entirely alone — they're the people who can accurately assess what they can handle alone and what requires bringing in additional resources. That's not weakness; that's sophisticated self-knowledge. The person who insists on managing everything alone until she's exhausted is not demonstrating capability. She's demonstrating the belief that asking for help would reveal an inadequacy — which is the old story, not the truth."]}]}, {"num": 3, "title": "Trust It", "tagline": "The Messy Middle as evidence — and why L, M, N, O, P are how you get to Z", "lessons": [{"id": "3.1", "title": "Tending the Garden", "objective": "By the end of this lesson, you can apply the garden practice to the mental landscape of the middle: tending your thoughts with intention every day, even when the ground looks bare.", "video": {"title": "Tending the Garden\" 90", "paragraphs": ["OPEN ON SHIBANI", "One of the most clarifying metaphors I've found for the mental experience of the Messy Middle is a garden.", "Not a finished garden. A garden in early spring, when you've turned the soil, planted the seeds, done everything right — and the ground is still bare. The work has been done. And yet anyone walking by would see dirt.", "This is the inner experience of the middle. You've made the decision. Done the work. And the internal landscape still looks like doubt — thoughts that cycle back to: is this working? Was this right? Should I be further along by now?", "Here's what I've learned about thought, particularly in the middle: our thoughts are the vibrational soil from which our lives sprout. What we tend to in our minds, what we water and return to — that is what grows. And the inverse is also true: what we leave untended gets crowded by weeds.", "In the middle, the weeds are specific and persistent: it's not working. I should have arrived by now. Maybe I was wrong. They come back. You pull them and they come back. This is not a failure of the garden — it's the nature of the middle, which gives weeds ideal growing conditions.", "The garden practice is not about never having the weeds. It's about tending daily — returning to the good soil, watering what you want to grow, noticing the weeds without letting them take over.", "So here's your practice. For one week, begin each morning with five minutes: what is growing in my mental garden right now? Name the weeds. Then name what you want to tend today — one thing you want to water. Write both down. Five minutes. Every morning.", "FADE OUT"]}, "type": "lesson", "_body": ["One of the most clarifying metaphors I've found for what happens inside the Messy Middle — inside the mental experience of being in the long stretch between deciding and arriving — is a garden.", "Not a finished garden. A garden in early spring, when you've turned the soil and planted the seeds and done everything right, and the ground is still bare. The work has been done. The conditions are right. And yet there is nothing visible to point to. Anyone walking by would see dirt.", "This is the inner experience of the middle. You've done the work. You've made the decision, started the process, done the informational interviews, written the non-negotiables list, asked for help. And the internal landscape still looks like dirt — thoughts that cycle back to doubt, to \"is this working,\" to the comparison between where you are and where you expected to be by now.", "Here is what I've learned about thought — particularly in the middle: our thoughts are the vibrational soil from which our lives sprout. I believe this as a spiritual truth and as a practical one. What we tend to in our minds, what we water and return to and give our attention to — that is what grows. And the inverse is also true: what we allow to grow unchecked, like weeds through the good soil, eventually crowds out what we were trying to cultivate.", "In the middle, the weeds are specific and persistent. They are called: it's not working, it was a mistake, I should have arrived by now, maybe I was wrong about myself. They come back. You pull them, and they come back. This is not a failure of the garden — it is the nature of weeds, and specifically the nature of the middle, which provides them with ideal growing conditions.", "The garden practice is not about never having the weeds. It's about tending daily — returning to the good soil, watering the things you actually want to grow, noticing the weeds without letting them take over. It's the daily version of the work. Not grand, not dramatic. Just: every morning, a few minutes with the garden.", "Daily Garden Check. For the next week, begin each morning with a five-minute garden practice. Sit quietly — without your phone, before you've done anything else. Ask yourself: what is growing in my mental garden right now? Name the weeds that arrived overnight — the doubts, the comparisons, the \"it's not working\" thoughts. Then name what you want to tend today — one thought you want to water, one belief you want to give your attention to. Write both down. Five minutes. Every morning.", "Reflect: After a week of the garden practice: what weeds tend to appear most reliably in the middle? And what grows when you give it your attention?"]}, {"id": "3.2", "title": "Through L, M, N, O, P", "objective": "By the end of this lesson, you can name the specific \"middle letters\" in your current journey — what they're requiring of you, and what they're teaching you that you couldn't have learned anywhere else — and understand them as path, not detour.", "video": {"title": "Through L, M, N, O, P\" 90", "paragraphs": ["OPEN ON SHIBANI", "Somewhere in my career transition, I had a moment of clarity about what was actually happening to me.", "I was being described as someone who \"used to work at Fox.\" I was driving to a job with no office with my name on the wall, no clothing rack, no magazine covers. I was talking to people I hadn't planned to need, doing things I hadn't predicted, going through a process that felt long and uncertain.", "And I thought: sometimes in order to go from A to Z, you have to move through letters L, M, N, O, and P.", "The middle letters are the ones that don't get included in the story you tell afterward. The interviews that went nowhere. The projects that taught you something without producing anything visible. The slow accumulation of small things that eventually became the foundation of what you were actually building toward.", "The middle letters are not detours. They are the path. They are specifically what gives you what you need to be capable of Z when you arrive — the depth, the self-knowledge, the understanding of what you're actually made of that you couldn't have gotten by skipping to the end.", "I couldn't have been ready for Stanford if I hadn't spent years working with brands, rebuilding, learning what I was actually good at outside the studio. The L, M, N, O, P weren't the unfortunate stretch before the good part. They were the preparation.", "So here's your practice. Map your current middle letters. What is each one requiring of you? What skills, what patience, what self-knowledge? And: what will you know, or be, when you come through this stretch that you didn't know before you entered it?", "FADE OUT"]}, "type": "lesson", "_body": ["Somewhere in my career transition — in the years of freelance work and rebuilding and finding my way toward whatever the next chapter would be — I had a moment of genuine clarity about what was happening to me.", "I was having people describe me as someone who \"used to work at Fox.\" I was driving to a job that didn't have an office with my name on the wall or a clothing rack or framed magazine covers. I was doing work that I hadn't quite predicted, talking to people I hadn't planned to need, going through a process that felt long and uncertain and very far from the clean arc I had imagined.", "And I thought: sometimes in order to go from A to Z, you have to move through letters L, M, N, O, and P.", "The middle letters are the ones that don't get included in the story you tell afterward. They're the interviews that didn't go anywhere, the projects that taught you something without producing anything visible, the conversations where you were trying to figure out who you were in this new landscape, the slow accumulation of small things that eventually became the foundation of the thing you were actually building toward.", "The middle letters are not detours. They are the path. They are specifically what gives you what you need to be capable of Z when you get there — the depth, the self-knowledge, the specif
